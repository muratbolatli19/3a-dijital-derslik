<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trafik Yarışçısı</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#fff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#192b40;border-radius:15px}header img{width:120px;background:white;border-radius:8px}h1{margin:0;font-size:24px}button,a{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:12px;background:#eaf2ff;color:#172638;text-decoration:none;touch-action:none}#stage{position:relative;overflow:hidden;border-radius:16px;margin-top:10px;background:#8bc5e8}canvas{display:block;width:100%;aspect-ratio:16/9}#hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#hud div{background:#101923d9;padding:10px 15px;border-radius:12px;font-weight:bold}#notice{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#101923d9;padding:9px 15px;border-radius:12px;text-align:center;max-width:90%}#overlay{position:absolute;inset:0;background:#0a1728b8;display:grid;place-items:center;text-align:center}#overlay[hidden]{display:none}#overlay div{background:#172b42e8;border:1px solid #ffffff44;border-radius:20px;padding:24px;max-width:380px}#start{background:#ffd15c}#controls{display:flex;justify-content:center;gap:12px;margin:12px}#controls button{flex:1;max-width:220px;min-height:60px;font-size:20px}#brake{background:#ff9b9b}small{color:#bacbdf}</style><main><header><a href="derslik.html">← Derslik</a><div><h1>TRAFİK YARIŞÇISI</h1><small>Güvenli sürüş · Doğa parkuru</small></div><img src="dijital-derslik-logo-seffaf.png" alt="Süleymaniye Okulları"></header><div id="stage"><canvas id="c" width="960" height="540"></canvas><div id="hud"><div id="speed">0 km/sa</div><div id="distance">0 m / 2500 m</div><div id="score">⭐ 0</div></div><div id="notice">Güvenli şeritte ilerle.</div><div id="overlay"><div><h2 id="title">Doğa Parkuru</h2><p id="desc">Araç otomatik ilerler. Tek dokunuşla şerit değiştir, gerektiğinde frene bas. Güvenli sürüşle bitişe ulaş!</p><button id="start">YARIŞA BAŞLA</button></div></div></div><div id="controls"><button id="left">◀ SOL</button><button id="brake">FREN</button><button id="right">SAĞ ▶</button></div><small>Klavye: ← → şerit değiştir · Boşluk: fren</small></main><script>const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),W=960,H=540,horizon=190,far=600;let lane=0,px=0,speed=0,dist=0,score=0,active=false,brake=false,last=0,traffic=[],nextSpawn=0,noticeUntil=0,hitUntil=0;const palette=['#b73535','#c5c8ce','#e7aa31','#345f9d','#34434b'];function poly(p,color){g.fillStyle=color;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function rect(x,y,w,h,color,r=0){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function project(z){let t=1-Math.max(0,Math.min(far,z))/far;let p=t*t;return {y:horizon+p*(H-horizon),w:18+p*470,s:.05+p*.95}}function car(x,y,s,color){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#0005';g.beginPath();g.ellipse(0,5,69,13,0,0,7);g.fill();rect(-62,-36,19,43,'#151a20',6);rect(43,-36,19,43,'#151a20',6);let grad=g.createLinearGradient(0,-85,0,0);grad.addColorStop(0,'#ffffff');grad.addColorStop(.13,color);grad.addColorStop(.7,color);grad.addColorStop(1,'#151c26');poly([[-62,-13],[-60,-45],[-42,-63],[-30,-83],[30,-83],[42,-63],[60,-45],[62,-13],[48,0],[-48,0]],grad);poly([[-34,-77],[34,-77],[44,-49],[-44,-49]],'#263b4d');poly([[-30,-74],[30,-74],[36,-61],[-36,-61]],'#7896aa');rect(-57,-36,35,9,'#ff3434',3);rect(22,-36,35,9,'#ff3434',3);rect(-55,-33,31,3,'#ff9c8d',1);rect(24,-33,31,3,'#ff9c8d',1);rect(-19,-23,38,11,'#e8e9df',2);rect(-48,-9,96,5,'#1a2028',2);rect(-50,-5,14,5,'#8b9299',2);rect(36,-5,14,5,'#8b9299',2);g.restore()}function tree(x,y,s){g.save();g.translate(x,y);g.scale(s,s);rect(-4,-38,8,38,'#765740');for(let [a,b,r,col] of [[0,-57,26,'#32653a'],[-14,-48,19,'#437c43'],[12,-48,20,'#508d48'],[-4,-65,17,'#669c51']]){g.fillStyle=col;g.beginPath();g.arc(a,b,r,0,7);g.fill()}g.restore()}function road(){let sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#68a9d9');sky.addColorStop(1,'#e0eff6');rect(0,0,W,horizon,sky);for(let i=0;i<5;i++)poly([[i*230-100,horizon],[i*230+60,70+(i%2)*40],[i*230+220,horizon]],i%2?'#779ca4':'#8baeb5');rect(0,horizon,W,H-horizon,'#75964c');for(let z=far;z>0;z-=6){let a=project(z),b=project(z-6),stripe=Math.floor((z+dist)/14)%2;rect(0,a.y,W,b.y-a.y+1,stripe?'#78994e':'#83a456');poly([[W/2-a.w-8,a.y],[W/2+a.w+8,a.y],[W/2+b.w+12,b.y],[W/2-b.w-12,b.y]],stripe?'#d6d1bf':'#aeb3a6');poly([[W/2-a.w,a.y],[W/2+a.w,a.y],[W/2+b.w,b.y],[W/2-b.w,b.y]],stripe?'#4c5055':'#50545a');for(let side of [-1,1]){let x=W/2+side*a.w*.96,xx=W/2+side*b.w*.96;poly([[x-1,a.y],[x+1,a.y],[xx+3,b.y],[xx-3,b.y]],'#f4f3e8')}if(stripe)for(let side of [-1,1]){let x=W/2+side*a.w/3,xx=W/2+side*b.w/3;poly([[x-1,a.y],[x+1,a.y],[xx+3,b.y],[xx-3,b.y]],'#e8e6d8')}}for(let i=0;i<18;i++){let z=far-((dist+i*37)%far),p=project(z);for(let side of [-1,1])tree(W/2+side*(p.w+35*p.s+12),p.y,p.s*1.8)}}function say(t){$('notice').textContent=t;noticeUntil=performance.now()+2500}function reset(){lane=px=0;speed=0;dist=score=0;traffic=[];nextSpawn=30;active=true;brake=false;hitUntil=0;$('overlay').hidden=true;say('Güvenli şeritte ilerle.')}function move(d){if(active)lane=Math.max(-1,Math.min(1,lane+d))}function finish(){active=false;$('title').textContent='🏆 Parkur tamamlandı';$('desc').textContent='Güvenli geçiş puanın: '+score;$('start').textContent='YENİDEN OYNA';$('overlay').hidden=false}function loop(now){requestAnimationFrame(loop);let dt=Math.min(.04,(now-last)/1000||.016);last=now;if(active){speed+=( (brake?8:72)-speed)*Math.min(1,dt*(brake?4:1.3));dist+=speed/3.6*dt;px+=(lane-px)*Math.min(1,dt*9);if(dist>nextSpawn){traffic.push({z:far-5,lane:Math.floor(Math.random()*3)-1,color:palette[Math.floor(Math.random()*palette.length)],passed:false});nextSpawn=dist+85+Math.random()*65}for(let t of traffic){t.z-=(speed/3.6-5)*dt*3;if(!t.passed&&t.z<35){t.passed=true;if(Math.abs(t.lane-px)<.58&&t.z>0){speed=12;score=Math.max(0,score-2);hitUntil=now+500;say('Takip mesafeni koru!')}else{score++;say('Güvenli geçiş! +1')}}}traffic=traffic.filter(t=>t.z>-40);if(dist>=2500)finish()}road();for(let t of [...traffic].sort((a,b)=>b.z-a.z)){let p=project(t.z);car(W/2+t.lane*p.w*2/3,p.y,p.s*.92,t.color)}if(now>hitUntil||Math.floor(now/80)%2)car(W/2+px*285,H-24,1.15,'#1979d5');$('speed').textContent=Math.round(speed)+' km/sa';$('distance').textContent=Math.min(2500,Math.floor(dist))+' m / 2500 m';$('score').textContent='⭐ '+score;if(now>noticeUntil)$('notice').textContent='Şerit değiştir · Güvenli mesafeyi koru'}$('start').onclick=reset;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('brake').onpointerdown=e=>{$('brake').setPointerCapture(e.pointerId);brake=true};$('brake').onpointerup=$('brake').onpointercancel=()=>brake=false;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(!e.repeat&&e.key==='ArrowLeft')move(-1);if(!e.repeat&&e.key==='ArrowRight')move(1);if(e.key===' ')brake=true});addEventListener('keyup',e=>{if(e.key===' ')brake=false});addEventListener('blur',()=>brake=false);requestAnimationFrame(loop);</script></html>
