<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minik Sürücü 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2a;color:white;font:16px system-ui}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:linear-gradient(120deg,#3945aa,#8054cf,#ed83b2)}header img{width:120px;background:white;border-radius:10px}h1{font-size:24px;margin:0}button,a{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:bold;background:#fff;color:#20304b;text-decoration:none;touch-action:none}#stage{position:relative;height: min(68vh,650px);min-height:320px}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}#hud>div,#notice{background:#102238dd;border:1px solid #ffffff55;border-radius:12px;padding:12px}#notice{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;text-align:center}#controls{display:flex;justify-content:space-between;padding:12px;gap:10px}#controls button{min-width:65px;min-height:58px;font-size:20px}#gas{background:#80e2a2}#brake{background:#ff8c8c}#overlay{position:absolute;inset:0;background:#102238b8;display:grid;place-items:center;text-align:center}#overlay>div{background:#203952;padding:24px;border-radius:20px;max-width:400px}#overlay[hidden]{display:none}#start{background:#ffda75}small{display:block;color:#c4d9ef}</style><header><a href="derslik.html">← Derslik</a><img src="dijital-derslik-logo-seffaf.png"><div><h1>Minik Sürücü 3D</h1><small>Şehir Sürüş Akademisi</small></div><button id="full">⛶</button></header><div id="stage"><div id="hud"><div id="mission">Görev: Okula ulaş</div><div id="speed">0 km/sa</div><div id="score">⭐ 0</div></div><div id="notice">Trafik kurallarına uy.</div><div id="overlay"><div><h2>Şehir seni bekliyor!</h2><p>Gaz, fren ve direksiyonla güvenli sürüş yap. Kırmızı ışıkta dur, hız sınırını aşma.</p><button id="start">Sürüşe başla</button><p id="load">3D şehir yükleniyor…</p></div></div></div><div id="controls"><div><button data-key="left">◀</button> <button data-key="right">▶</button></div><button id="reset">↻</button><div><button id="brake" data-key="brake">FREN</button> <button id="gas" data-key="gas">GAZ</button></div></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';const $=id=>document.getElementById(id),stage=$('stage');const scene=new T.Scene();scene.background=new T.Color(0x9fd4fa);scene.fog=new T.Fog(0x9fd4fa,90,230);const camera=new T.PerspectiveCamera(65,1,.1,300);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xeaf6ff,0x64764b,2.3));let sun=new T.DirectionalLight(0xfff0d6,2.5);sun.position.set(-35,65,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-65,right:65,top:65,bottom:-65});scene.add(sun);function box(w,h,d,x,y,z,col,parent=scene){let m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:col}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}box(220,.4,220,0,-.3,0,0x80ad66);for(let p of [-60,0,60]){box(14,.1,200,p,0,0,0x434b54);box(200,.1,14,0,.01,p,0x434b54);for(let side of [-1,1]){box(2,.25,200,p+side*8,.1,0,0xc9c8c1);box(200,.25,2,0,.11,p+side*8,0xc9c8c1)}for(let q=-96;q<98;q+=5){if([-60,0,60].some(v=>Math.abs(q-v)<10))continue;box(.13,.025,2.4,p,.07,q,0xffe3a1);box(2.4,.025,.13,q,.08,p,0xffe3a1)}}for(let x of [-90,-30,30,90])for(let z of [-90,-30,30,90]){let h=8+Math.abs(Math.sin(x*z+z))*16;box(23,h,20,x,h/2,z,[0xd7c2ac,0xb7c9d9,0xe2b5a1,0xd7d8c8][Math.abs(x+z)%4]);box(24,.5,21,x,h+.25,z,0x677887);for(let f=2;f<h-1;f+=3)for(let k=-8;k<=8;k+=4){box(2,1.5,.08,x+k,f,z+10.05,0x52788e);box(.08,1.5,2,x+11.55,f,z+k,0x52788e)}for(let s of [-1,1]){box(.5,3,.5,x+s*17,1.5,z+15,0x805c3e);let tree=new T.Mesh(new T.SphereGeometry(2.5,12,8),new T.MeshStandardMaterial({color:0x418c48}));tree.position.set(x+s*17,4,z+15);tree.castShadow=true;scene.add(tree)}}function car(color){let o=new T.Group();scene.add(o);box(2.05,.65,4.3,0,.65,0,color,o);box(1.8,.65,2.2,0,1.25,.2,0x253f55,o);box(1.75,.15,1.9,0,1.65,.2,color,o);for(let s of [-1,1])for(let z of [-1.35,1.35]){let w=new T.Mesh(new T.CylinderGeometry(.42,.42,.34,16),new T.MeshStandardMaterial({color:0x171b20}));w.rotation.z=Math.PI/2;w.position.set(s*1.02,.42,z);o.add(w)}for(let s of [-1,1]){box(.55,.22,.08,s*.63,.8,-2.18,0xfff3bb,o);box(.55,.22,.08,s*.63,.8,2.18,0xe93c39,o)}return o}let player=car(0x197de0);let traffic=[];for(let i=0;i<6;i++){let o=car([0xe8a341,0xf3f3f3,0xb44b55][i%3]);traffic.push({o,p:i*30-90,lane:i%2?3:-3,axis:i%2})}let signals=[];for(let x of [-60,0,60])for(let z of [-60,0,60]){for(let k=0;k<7;k++){box(1,.025,2,x-5.5+k*1.8,.08,z+8,0xffffff);box(2,.025,1,x+8,.08,z-5.5+k*1.8,0xffffff)}box(.2,4,.2,x+8,2,z+8,0x333b43);box(.8,1.8,.6,x+8,4,z+8,0x252c33);let red=box(.45,.45,.08,x+8,4.5,z+8.34,0xff3333),green=box(.45,.45,.08,x+8,3.5,z+8.34,0x224422);signals.push({x,z,red,green})}const goals=[{x:3,z:-85,n:'Okul'},{x:85,z:-3,n:'Hastane'},{x:-85,z:3,n:'Park'},{x:-3,z:85,n:'Ev'}];let marker=new T.Mesh(new T.TorusGeometry(2.8,.15,8,32),new T.MeshBasicMaterial({color:0xffdf37}));marker.rotation.x=Math.PI/2;scene.add(marker);let keys={},v=0,yaw=0,active=false,level=0,points=0,last=0,penalty=0;function reset(){player.position.set(3,0,85);yaw=0;v=0;level=points=0;active=true;$('overlay').hidden=true;$('notice').textContent='Okula doğru ilerle. Sağ şeritte kal.'}function road(x,z){return Math.abs(x)<6.6||Math.abs(x-60)<6.6||Math.abs(x+60)<6.6||Math.abs(z)<6.6||Math.abs(z-60)<6.6||Math.abs(z+60)<6.6}function warn(t,now){v=0;if(now-penalty>1800){penalty=now;$('notice').textContent=t;if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}}}function resize(){let w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();player.position.set(3,0,85);function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000||.016);last=now;let green=Math.floor(now/9000)%2===0;for(let s of signals){s.red.material.color.set(green?0x542323:0xff3333);s.green.material.color.set(green?0x32ff65:0x224422)}for(let t of traffic){if(t.axis?!green:green)t.p+=dt*7;if(t.p>100)t.p=-100;t.o.position.set(t.axis?t.p:t.lane,0,t.axis?t.lane:t.p);t.o.rotation.y=t.axis?-Math.PI/2:Math.PI}let goal=goals[Math.min(level,3)];marker.position.set(goal.x,.12,goal.z);if(active){if(keys.gas)v=Math.min(10,v+dt*4);else v=Math.max(0,v-dt*1.3);if(keys.brake)v=Math.max(0,v-dt*12);yaw+=((keys.left?1:0)-(keys.right?1:0))*dt*1.25*Math.min(1,v/3);let old=player.position.clone(),nx=old.x-Math.sin(yaw)*v*dt,nz=old.z-Math.cos(yaw)*v*dt;if(!road(nx,nz)||Math.abs(nx)>97||Math.abs(nz)>97)warn('Yol dışına çıkma!',now);else{let blocked=false;for(let s of signals){let vert=Math.abs(nx-s.x)<7&&Math.abs(old.z-s.z)>10&&Math.abs(nz-s.z)<=10;let hor=Math.abs(nz-s.z)<7&&Math.abs(old.x-s.x)>10&&Math.abs(nx-s.x)<=10;if(vert&&!green||hor&&green)blocked=true}if(blocked)warn('Kırmızı ışık! Dur ve yeşili bekle.',now);else if(traffic.some(t=>Math.hypot(nx-t.o.position.x,nz-t.o.position.z)<3.1))warn('Takip mesafeni koru!',now);else player.position.set(nx,0,nz)}if(Math.hypot(player.position.x-goal.x,player.position.z-goal.z)<4&&v<.6){points++;level++;$('notice').textContent='Tebrikler! Hedefe güvenle ulaştın.';if(level>=goals.length){active=false;$('notice').textContent='🏆 Sürüş akademisini tamamladın!'}}}player.rotation.y=yaw;let offset=new T.Vector3(Math.sin(yaw)*9,5.3,Math.cos(yaw)*9);camera.position.lerp(player.position.clone().add(offset),.12);camera.lookAt(player.position.clone().add(new T.Vector3(-Math.sin(yaw)*8,1.2,-Math.cos(yaw)*8)));$('speed').textContent=Math.round(v*3.6)+' km/sa';$('score').textContent='⭐ '+points;$('mission').textContent=level<4?'Hedef: '+goal.n:'Görev tamamlandı';renderer.render(scene,camera)}requestAnimationFrame(loop);$('load').textContent='Şehir hazır.';$('start').onclick=reset;$('reset').onclick=reset;$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();const map={ArrowUp:'gas',ArrowDown:'brake',ArrowLeft:'left',ArrowRight:'right',w:'gas',s:'brake',a:'left',d:'right'};addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}});addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});addEventListener('blur',()=>keys={});document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[b.dataset.key]=true};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.key]=false});</script></html>
