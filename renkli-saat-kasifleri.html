/30,l=document.createElementNS(ns,'line');for(let [key,v] of Object.entries({x1:200+Math.sin(a)*166,y1:200-Math.cos(a)*166,x2:200+Math.sin(a)*(k%5?160:151),y2:200-Math.cos(a)*(k%5?160:151),stroke:'#655d92','stroke-width':k%5?2:5}))l.setAttribute(key,v);$('ticks').append(l)}for(let k=1;k<=12;k++){let a=k*Math.PI/6,t=document.createElementNS(ns,'text');t.setAttribute('x',200+Math.sin(a)*132);t.setAttribute('y',200-Math.cos(a)*132+10);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','27');t.setAttribute('font-weight','bold');t.setAttribute('fill','#303263');t.textContent=k;$('ticks').append(t)}function speak(t){if(sound&&window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}}function show(id){['menu','game','result'].forEach(x=>$(x).hidden=x!==id)}function fmt(a,b){return String(a).padStart(2,'0')+':'+String(b).padStart(2,'0')}function draw(){let a=mode?th:h,b=mode?tm:m;$('hour').setAttribute('transform','rotate('+((a%12)*30+b*.5)+' 200 200)');$('minute').setAttribute('transform','rotate('+(b*6)+' 200 200)');$('digital').textContent=mode?fmt(h,m):locked?fmt(h,m):'--:--'}function start(n){mode=n;i=stars=errors=0;show('game');render()}function render(){locked=false;th=1+Math.floor(Math.random()*12);tm=th===12?0:[0,15,30,45][Math.floor(Math.random()*4)];h=1;m=0;$('stats').textContent='Görev '+(i+1)+'/15 · ⭐ '+stars;$('progress').value=i;$('goal').textContent=mode?'Analog saati oku, dijital saati ayarla!':'Saati '+fmt(th,tm)+' yap!';$('adjust').hidden=!mode;$('hint').textContent=mode?'Saat ve dakika düğmelerini kullan.':'Akrep ve yelkovanı tutup döndür.';$('feedback').textContent='';$('next').hidden=true;draw()}function fix(){if(h===12)m=0;draw()}function change(dh,dm){if(locked)return;h=(h-1+dh+12)%12+1;m=(m+dm+60)%60;draw()}$('hm').onclick=()=>change(-1,0);$('hp').onclick=()=>change(1,0);$('mm').onclick=()=>change(0,-5);$('mp').onclick=()=>change(0,5);const svg=$('clock');function a (async()=>{try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm');const db=createClient('https://zhmkyfouskthqgrhvhqp.supabase.co','sb_publishable_YcqB4BO9knYzHk4KKLye3A_ilBb6I9u',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let {data:{user}}=await db.auth.getUser();if(!user){const {data:{session}}=await db.auth.getSession();user=session?.user}if(user){const {data,error}=await db.from('profiles').select('display_name,role,active').eq('id',user.id).maybeSingle();if(!error&&data?.role==='student'&&data.active)setPlayerName(data.display_name);}}catch(e){console.warn('Öğrenci adı alınamadı',e)}if(studentFirstName==='arkadaşım')$('playerName').textContent='👤 Adın görünmüyor mu? Adımı düzelt düğmesine bas.';})();
