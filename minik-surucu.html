<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minik Sürücü</title><style>*{box-sizing:border-box}body{margin:0;background:#14263a;color:white;font:16px system-ui}main{max-width:1100px;margin:auto;padding:12px}header{text-align:center;background:linear-gradient(125deg,#3945aa,#8054cf,#ed83b2);border:3px solid white;border-radius:24px;padding:12px}header h1{margin:5px;font-size:36px}.hero-brand{width:160px;height:60px;object-fit:contain;background:white;border-radius:12px}.hero-art{font-size:30px}.toolbar{display:flex;justify-content:space-between;gap:5px}button,a{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:12px;color:#24354c;background:#fff;text-decoration:none;touch-action:none}#hud{display:flex;justify-content:space-between;gap:10px;background:#243c52;padding:12px;border-radius:14px;margin:10px 0;flex-wrap:wrap}canvas{width:100%;display:block;border-radius:16px;background:#8cba78}#controls{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:10px}#controls button{font-size:24px;min-width:66px;min-height:62px;user-select:none}#gas{background:#8ce2a4}#brake{background:#ff9b9b}#notice{min-height:30px;text-align:center;color:#ffe4a2;font-weight:bold}#mission{color:#b8f6ff}#start{background:#ffe19b}#speed{font-size:22px;font-weight:bold}</style><main><header><div class="toolbar"><a href="oyun-test-merkezi.html?section=games">← Oyunlar</a> <button id="sound">🔊 Ses açık</button> <button id="full">⛶ Tam ekran</button></div><div class="hero-art">🚦 🚗 🏫</div><img class="hero-brand" src="dijital-derslik-logo-seffaf.png" alt="Süleymaniye Okulları"><h1>🚦 Minik Sürücü</h1><p>Şehir sürüş akademisi</p><p id="playerName">Süleymaniye Okulları · 3. Sınıf</p></header><div id="hud"><span id="mission">Görev 1: Okula ulaş</span><span id="speed">0 km/sa</span><span id="score">⭐ 0 · ❤️ 3</span><button id="start">Başlat / Yeniden başlat</button></div><canvas id="city" width="960" height="620"></canvas><div id="notice">Gaz ve direksiyonla ilerle. Trafik ışıklarına dikkat!</div><div id="controls"><div><button data-key="left">◀</button> <button data-key="right">▶</button></div><div><button id="brake" data-key="brake">FREN</button> <button id="gas" data-key="gas">GAZ</button></div></div><p>Bilgisayar: ↑ gaz, ↓ fren, ← → direksiyon. Telefonda ekrandaki düğmeleri kullan.</p></main><script>const $=id=>document.getElementById(id),c=$('city'),g=c.getContext('2d');let keys={},x=480,y=570,a=-Math.PI/2,v=0,active=false,stars=0,life=3,level=0,sound=true,last=0,penalty=0,stopped=false,prevY=570,prevX=480,studentFirstName='arkadaşım';const goals=[{x:480,y:55,n:'Okul'},{x:905,y:310,n:'Hastane'},{x:55,y:310,n:'Park'},{x:480,y:570,n:'Ev'},{x:480,y:55,n:'Okul'}];function speak(t){if(sound&&window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}}function msg(t){$('notice').textContent=t}function reset(){x=480;y=570;a=-Math.PI/2;v=0;life=3;stars=0;level=0;active=true;stopped=false;msg('Okula doğru sür. Kırmızı ışıkta dur!');speak('Minik sürücü, güvenli yolculuklar!')}function rect(x,y,w,h,col,r=0){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function text(t,x,y,s=18,col='#fff'){g.font='bold '+s+'px system-ui';g.textAlign='center';g.fillStyle=col;g.fillText(t,x,y)}function road(px,py){return (px>416&&px<544)||(py>246&&py<374)}function tree(x,y){g.fillStyle='#477d45';g.beginPath();g.arc(x+5,y+5,19,0,7);g.fill();g.fillStyle='#5b9e50';g.beginPath();g.arc(x,y,18,0,7);g.fill();g.fillStyle='#80b86a';g.beginPath();g.arc(x-5,y-5,10,0,7);g.fill()}function building(x,y,w,h,col,n){rect(x+8,y+9,w,h,'#0003',7);rect(x,y,w,h,col,7);rect(x+8,y+8,w-16,h-16,'#ffffff30',5);for(let j=0;j<3;j++)rect(x+12+j*(w-24)/3,y+18,18,14,'#bfeaff',2);text(n,x+w/2,y+h-15,18,'#263a4b')}function vehicle(x,y,a,col){g.save();g.translate(x,y);g.rotate(a);rect(-21,-12,46,27,'#0005',7);rect(-17,-15,34,30,col,8);rect(-8,-12,16,24,'#b8e5f5',4);rect(-3,-12,6,24,col);for(let yy of [-16,12]){rect(-12,yy,9,4,'#17202b');rect(7,yy,9,4,'#17202b')}rect(13,-10,4,6,'#fff3ad');rect(13,4,4,6,'#fff3ad');rect(-17,-10,3,6,'#ff6b6b');rect(-17,4,3,6,'#ff6b6b');g.restore()}function lamp(x,y,green){rect(x,y,23,48,'#25303b',5);for(let k=0;k<3;k++){g.fillStyle=k===0?(!green?'#ff4747':'#643b3b'):k===1?'#77633a':green?'#42f078':'#365b42';g.beginPath();g.arc(x+11,y+9+k*15,5,0,7);g.fill()}}function fault(t,now){if(now-penalty<1800)return;penalty=now;life--;v=0;msg(t);speak(t);if(life<=0){active=false;msg('Görev sona erdi. Yeniden başlatabilirsin.')}}function frame(now){let dt=Math.min(2,(now-last)/16.67||1);last=now;let green=Math.floor(now/6000)%2===0;let goal=goals[level]||goals[4];if(active){prevX=x;prevY=y;if(keys.gas)v=Math.min(3.5,v+.065*dt);else v*=Math.pow(.98,dt);if(keys.brake)v=Math.max(0,v-.19*dt);if(v>.03)a+=(keys.right?1:0)*.045*dt-(keys.left?1:0)*.045*dt;let nx=x+Math.cos(a)*v*dt,ny=y+Math.sin(a)*v*dt;if(nx<20||nx>940||ny<20||ny>600||!road(nx,ny)){fault('Yolun dışına çıkma!',now);v=0}else{x=nx;y=ny}let crossing=(prevY>395&&y<=395)||(prevY<225&&y>=225);let horizontal=(prevX<395&&x>=395)||(prevX>565&&x<=565);if((crossing&&!green)||(horizontal&&green)){x=prevX;y=prevY;fault('Kırmızı ışıkta durmalısın!',now)}if(Math.hypot(x-goal.x,y-goal.y)<38&&v<.8){stars++;level++;speak('Tebrikler '+studentFirstName+'! Hedefe ulaştın.');if(level===goals.length){active=false;msg('🏆 Minik Sürücü Ehliyeti kazandın!')}else msg('Yeni hedef: '+goals[level].n)}}g.fillStyle='#a4ca86';g.fillRect(0,0,960,620);rect(400,0,160,620,'#d5d2c7');rect(0,230,960,160,'#d5d2c7');rect(416,0,128,620,'#505b65');rect(0,246,960,128,'#505b65');for(let j=0;j<620;j+=38)if(j<225||j>390)rect(478,j,4,21,'#f6e8a4');for(let j=0;j<960;j+=38)if(j<395||j>560)rect(j,308,21,4,'#f6e8a4');for(let j=0;j<8;j++){rect(420+j*15,385,9,20,'#fff');rect(420+j*15,215,9,20,'#fff');rect(385,250+j*15,20,9,'#fff');rect(555,250+j*15,20,9,'#fff')}building(250,25,135,105,'#f4cc8a','OKUL');building(760,100,165,110,'#f4b9b9','HASTANE +');building(260,460,120,110,'#e4b4a0','EV');building(610,450,140,110,'#b9c9e9','MARKET');for(let p of [[40,60],[95,90],[150,40],[65,165],[180,150],[650,55],[700,170],[70,470],[150,530],[840,470],[900,550]])tree(...p);text('PARK',95,205,22,'#35643d');lamp(550,395,green);lamp(385,180,green);lamp(565,215,!green);lamp(375,390,!green);let t=(now/22)%1100;vehicle(green?510:510,green?650-t:420,-Math.PI/2,'#f3a94f');vehicle(!green?t-60:360,280,0,'#b3c5f3');g.strokeStyle='#ffe85c';g.lineWidth=5;g.beginPath();g.arc(goal.x,goal.y,32+Math.sin(now/250)*4,0,7);g.stroke();text('HEDEF',goal.x,goal.y-39,15,'#fff');vehicle(x,y,a,'#28b9ec');$('speed').textContent=Math.round(v*10)+' km/sa';$('score').textContent='⭐ '+stars+' · ❤️ '+life;$('mission').textContent=level<5?'Görev '+(level+1)+': '+goal.n+' hedefine ulaş ve dur':'Görevler tamamlandı';requestAnimationFrame(frame)}const map={ArrowUp:'gas',ArrowDown:'brake',ArrowLeft:'left',ArrowRight:'right'};window.addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();keys[map[e.key]]=true}});window.addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[b.dataset.key]=true};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.key]=false});window.onblur=()=>keys={};$('start').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Ses açık':'🔇 Ses kapalı'};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();requestAnimationFrame(frame);</script></html>
