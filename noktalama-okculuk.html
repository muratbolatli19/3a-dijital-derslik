oveTo(x,y);g.lineTo(a,b);g.stroke()}function draw(){g.fillStyle='#bceaff';g.fillRect(0,0,900,500);circle(815,55,34,'#ffe379');for(let k=0;k<5;k++){circle(70+k*185,300,125,'#a3d88b')}g.fillStyle='#72bd77';g.fillRect(0,310,900,190);for(let k=0;k<4;k++){let t=target(k);line(t.x,t.y+45,t.x,310,'#97653e',13);circle(t.x,t.y,68,'white');circle(t.x,t.y,62,colors[k]);circle(t.x,t.y,46,'white');circle(t.x,t.y,37,colors[k]);circle(t.x,t.y,27,'white');g.fillStyle='#24354b';g.font='bold 52px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(marks[k],t.x,t.y-3)}let dx=drag?bow.x-drag.x:0,dy=drag?bow.y-drag.y:-100,angle=Math.atan2(dy,dx);g.save();g.translate(bow.x,bow.y);g.rotate(angle+Math.PI/2);g.strokeStyle='#92532c';g.lineWidth=12;g.beginPath();g.moveTo(-65,0);g.quadraticCurveTo(0,-70,65,0);g.stroke();let pull=drag?Math.min(95,Math.hypot(dx,dy)):0;line(-65,0,0,pull,'#fff',3);line(0,pull,65,0,'#fff',3);g.restore();if(drag&&!flight){let len=Math.hypot(dx,dy)||1;line(bow.x,bow.y,bow.x+dx/len*420,bow.y+dy/len*420,'#ffffff99',2)}if(!flight&&!locked){arrow(drag?drag.x:bow.x,drag?drag.y:bow.y,angle)}if(flight){let t=Math.min(1,(performance.now()-flight.start)/480),x=bow.x+(flight.x-bow.x)*t,y=bow.y+(flight.y-bow.y)*t;arrow(x,y,Math.atan2(flight.y-bow.y,flight.x-bow.x));if(t===1){let f=flight;flight=null;hit(f.k)}}if(flash){let t=(performance.now()-flash.start)/850;if(t<1){g.font='30px system-ui';for(let n=0;n<12;n++){let a=n*Math.PI/6;g.fillText('⭐',flash.x+Math.cos(a)*t*100,flash.y+Math.sin(a)*t*100)}}else flash=null}requestAnimationFrame(draw)}function arrow(x,y,a){g.save();g.translate(x,y);g.rotate(a);line(-48,0,12,0,'#754a2c',5);g.fillStyle='#34445b';g.beginPath();g.moveTo(22,0);g.lineTo(7,-8);g.lineTo(7,8);g.fill();g.restore()}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*500/r.height}}c.onpointerdown=e=>{if(locked||flight)return;let p=point(e);if(Math.hypot(p.x-bow.x,p.y-bow.y)>95)return;drag=p;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag)drag=point(e)};c.onpointercancel=()=>drag=null;c.onpointerup=e=>{if(!drag)return;let p=point(e),dx=bow.x-p.x,dy=bow.y-p.y;drag=null;if(Math.hypot(dx,dy)<15||dy>=-5)return;let x=bow.x+dx*(125-bow.y)/dy;let k=marks.findIndex((_,k)=>Math.abs(target(k).x-x)<=68);flight={x,y:125,k,start:performance.now()}};function hit(k){if(k>=0&&marks[k]===order[i][1]){locked=true;stars++;flash={...target(k),start:performance.now()};$('feedback').textContent='⭐ Tebrikler! Tam isabet!';speak('Tebrikler '+studentFirstName+'! Tam isabet!');$('next').hidden=false}else{errors++;$('feedback').textContent=k<0?'Biraz daha iyi nişan al!':'Tekrar dene, doğru işareti bul!';speak('Tekrar dene '+studentFirstName)}stats()}document.addEventListener('keydown',e=>{let k=Number(e.key)-1;if(!$('game').hidden&&!locked&&!flight&&k>=0&&k<4)flight={...target(k),k,start:performance.now()}});$('next').onclick=()=>{if(++i<15)return render();show('result');$('resultText').textContent=stars+' yıldız · '+errors+' hatalı atış';speak('Tebrikler '+studentFirstName+'!')};$('a').onclick=()=>start(0);$('b').onclick=()=>start(1);$('again').onclick=()=>start(mode);$('home').onclick=$('menuBack').onclick=()=>{flight=drag=null;show('menu')};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Ses açık':'🔇 Ses kapalı'};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();function setPlayerName(display){if(typeof display!=='string'||!display.trim())return;const first=display.trim().split(/\s+/)[0];studentFirstName=first.charAt(0).toLocaleUpperCase('tr-TR')+first.slice(1).toLocaleLowerCase('tr-TR');$('playerName').textContent='👩‍🚀 Oyuncu: '+studentFirstName;}
