<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trafik Mimarı</title><style>*{box-sizing:border-box}body{margin:0;background:#e9f0f5;color:#20364b;font:16px system-ui}main{max-width:1100px;margin:auto;padding:16px}header{background:linear-gradient(115deg,#183e58,#287e85);color:white;border-radius:20px;padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header img{width:130px;background:white;border-radius:10px;padding:5px}h1{margin:0;font-size:30px}button,a{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px;cursor:pointer;text-decoration:none;color:inherit}header a{background:#ffffff22}#status{display:flex;justify-content:space-between;align-items:center;margin:15px 0;gap:10px;flex-wrap:wrap}#scene{position:relative;background:#c8e1b4;border-radius:18px;overflow:hidden;box-shadow:0 6px 22px #20364b22}svg.city{width:100%;display:block}.spot{position:absolute;transform:translate(-50%,-50%);width:clamp(35px,6vw,64px);aspect-ratio:1;padding:3px;border:3px dashed #f0a51b;background:#fff9e3;color:#8b5900;border-radius:50%;font-size:25px;box-shadow:0 2px 8px #0004}.spot.done{border:2px solid #31936c;background:white}.spot svg{width:100%;height:100%}#tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin:12px 0}.tile{background:white;box-shadow:0 2px 6px #20364b20;display:grid;justify-items:center;gap:6px;font-size:13px;min-height:105px}.tile svg{width:58px;height:58px}.tile.selected{outline:3px solid #2586c7;background:#e6f5ff}.tile.used{opacity:.35;pointer-events:none}#message{padding:14px;background:white;border-radius:12px;min-height:52px;font-weight:600}#next{background:#217f67;color:white}#next[hidden]{display:none}#progress{height:8px;background:#cbd8e2;border-radius:8px;overflow:hidden}#bar{height:100%;background:#2ca57c;transition:width .3s}#brief{font-size:15px;color:#466175}</style><main><header><a href="derslik.html">← Derslik</a><img src="dijital-derslik-logo-seffaf.png"><div><h1>TRAFİK MİMARI</h1><div>Şehrini güvenli yap!</div></div></header><div id="status"><strong id="level"></strong><strong id="score">⭐ 0 / 15</strong><button id="next" hidden>Sonraki bölge →</button></div><div id="progress"><div id="bar"></div></div><p id="brief">Bir levhayı seç, ardından şehirde uygun noktaya dokun. Bilgisayarda sürükleyebilirsin.</p><div id="scene"></div><div id="tray"></div><div id="message" aria-live="polite"></div></main><script>const $=id=>document.getElementById(id);const signs={school:['Okul geçidi','triangle','<circle cx="43" cy="34" r="5"/><circle cx="60" cy="39" r="4"/><path d="M43 40v16l-9 12m9-12 10 12m-10-24 13 5m4-5v12l-6 9m6-9 8 9" stroke="#111" stroke-width="4" fill="none"/>'],ped:['Yaya geçidi','blue','<path d="M13 83 50 15 87 83Z" fill="white"/><circle cx="50" cy="40" r="5"/><path d="M50 46 44 60 34 72m10-12 15 12m-9-23 12 9" stroke="#111" stroke-width="5" fill="none"/>'],stop:['DUR','stop','<text x="50" y="58" text-anchor="middle" fill="white" font-size="26" font-weight="bold">DUR</text>'],noentry:['Girilmez','red','<rect x="18" y="42" width="64" height="16" rx="2" fill="white"/>'],parking:['Park yasaktır','ban','<text x="50" y="65" text-anchor="middle" font-size="45" fill="white" font-weight="bold">P</text><path d="M20 20 80 80" stroke="#e33" stroke-width="9"/>'],bike:['Bisiklet yolu','circle','<g stroke="white" stroke-width="4" fill="none"><circle cx="30" cy="62" r="15"/><circle cx="72" cy="62" r="15"/><path d="M30 62 45 40 58 62 30 62 49 62 65 34 72 62M59 34h14M39 40h12"/></g>'],works:['Yol çalışması','triangle','<circle cx="43" cy="37" r="5"/><path d="M43 43 54 54 43 68m11-14 10 14m-21-25-10 14m0 0 28 12" stroke="#111" stroke-width="5" fill="none"/><path d="M62 73 72 59 82 73Z"/>'],speed:['Hız sınırı 30','limit','<text x="50" y="65" text-anchor="middle" font-size="40" font-weight="bold">30</text>'],hospital:['Hastane','blue','<text x="50" y="68" text-anchor="middle" font-size="52" fill="white" font-weight="bold">H</text>'],lights:['Işıklı işaret cihazı','triangle','<rect x="39" y="30" width="22" height="43" rx="4" fill="#222"/><circle cx="50" cy="39" r="5" fill="#e33"/><circle cx="50" cy="51" r="5" fill="#f5b72d"/><circle cx="50" cy="63" r="5" fill="#3a5"/>']};function sign(id){let [name,type,inner]=signs[id];let base=type==='triangle'?'<path d="M50 7 95 86H5Z" fill="white" stroke="#d92d38" stroke-width="8" stroke-linejoin="round"/>':type==='stop'?'<path d="M30 5H70L95 30V70L70 95H30L5 70V30Z" fill="#d92d38" stroke="white" stroke-width="3"/>':type==='blue'?'<rect x="5" y="5" width="90" height="90" rx="4" fill="#1765b2"/>':'<circle cx="50" cy="50" r="44" fill="'+(type==='red'?'#d92d38':type==='limit'?'white':'#1765b2')+'" stroke="'+(type==='limit'||type==='ban'?'#d92d38':'white')+'" stroke-width="8"/>';return '<svg viewBox="0 0 100 100" aria-label="'+name+'">'+base+inner+'</svg>'}const levels=[{name:'Okul çevresi',spots:[[25,39,'school','Öğrenciler burada okula gidiyor.'],[47,60,'ped','Çizgili geçitten yayalar karşıya geçiyor.'],[75,40,'speed','Okul çevresinde hız 30 ile sınırlandırılmış.'],[22,80,'parking','Okul kapısının önü boş kalmalı.'],[72,81,'stop','Yan yoldan gelen araçlar tamamen durmalı.']]},{name:'Mahalle ve park',spots:[[25,39,'bike','Bu ayrılmış yol bisikletliler için.'],[47,60,'ped','Park ziyaretçileri burada karşıya geçiyor.'],[75,40,'noentry','Bu sokağa araç girişi yasak.'],[22,80,'works','Yolun bu kısmında bakım yapılıyor.'],[72,81,'stop','Kavşakta araçlar tamamen durmalı.']]},{name:'Şehir merkezi',spots:[[25,39,'hospital','Yakındaki hastaneyi göster.'],[47,60,'ped','Yayaların karşıya geçeceği yer.'],[75,40,'lights','İleride trafik ışıkları var.'],[22,80,'parking','Acil giriş önünde park edilmemeli.'],[72,81,'noentry','Tek yönlü sokağa ters yönden girilmemeli.']]}];let level=0,score=0,selected=null,done=new Set();function building(x,y,w,h,col,label){return '<g><path d="M'+x+' '+y+'l25 -18h'+w+'l-25 18Z" fill="#f3d9b8"/><path d="M'+(x+w)+' '+y+'l25 -18v'+h+'l-25 18Z" fill="#a7aeb2"/><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2" fill="'+col+'"/>'+Array.from({length:4},(_,i)=>'<rect x="'+(x+12+i*(w-20)/4)+'" y="'+(y+12)+'" width="17" height="19" rx="2" fill="#729db4"/>').join('')+'<rect x="'+(x+w/2-13)+'" y="'+(y+h-29)+'" width="26" height="29" fill="#496778"/><text x="'+(x+w/2)+'" y="'+(y+h-35)+'" text-anchor="middle" font-size="15" font-weight="bold" fill="#233c4e">'+label+'</text></g>'}function city(){let l=level;return '<svg class="city" viewBox="0 0 900 480"><defs><linearGradient id="grass" x2="0" y2="1"><stop stop-color="#b8dca6"/><stop offset="1" stop-color="#8fbd82"/></linearGradient><pattern id="p" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 0H16V16" fill="none" stroke="#b8b9ad" stroke-width="1"/></pattern></defs><rect width="900" height="480" fill="url(#grass)"/><path d="M0 245H900M450 0V480" stroke="#d8d5c7" stroke-width="115"/><path d="M0 245H900M450 0V480" stroke="#4c5863" stroke-width="83"/><path d="M0 245H390M510 245H900M450 0V190M450 300V480" stroke="#f8e8a6" stroke-width="3" stroke-dasharray="19 13"/>'+Array.from({length:8},(_,i)=>'<rect x="'+(407+i*11)+'" y="280" width="7" height="23" fill="white"/>').join('')+building(65,50,230,105,'#f1cf9c',l===0?'OKUL':l===1?'PARK TESİSİ':'HASTANE')+building(590,45,200,110,'#d6e0ed',l===0?'KÜTÜPHANE':l===1?'MAHALLE':'BELEDİYE')+building(65,350,190,100,'#e6b5a5',l===0?'SPOR SALONU':l===1?'MARKET':'ACİL GİRİŞ')+building(610,350,180,100,'#e7d6ac','MAHALLE')+Array.from({length:12},(_,i)=>{let x=[25,340,560,855][i%4],y=25+Math.floor(i/4)*165;return '<g><ellipse cx="'+(x+5)+'" cy="'+(y+8)+'" rx="21" ry="12" fill="#527d5260"/><rect x="'+(x-3)+'" y="'+(y-3)+'" width="6" height="20" fill="#8b6645"/><circle cx="'+x+'" cy="'+(y-8)+'" r="19" fill="#438657"/><circle cx="'+(x-5)+'" cy="'+(y-14)+'" r="12" fill="#70ad69"/></g>'}).join('')+'<g transform="translate(110 220)"><rect width="65" height="27" rx="7" fill="#246baf"/><rect x="17" y="4" width="30" height="19" rx="4" fill="#b7d7e7"/></g><g transform="translate(740 260)"><rect width="65" height="27" rx="7" fill="#ce694a"/><rect x="17" y="4" width="30" height="19" rx="4" fill="#b7d7e7"/></g></svg>'}function msg(t){$('message').textContent=t}function speak(t){if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}}function place(i,id){if(done.has(i))return;let s=levels[level].spots[i];if(!id){msg(s[3]+' Uygun levhayı seç.');return}if(id!==s[2]){msg('Tekrar dene. '+s[3]);speak('Tekrar dene.');return}done.add(i);score++;selected=null;render();msg('Tebrikler! '+signs[id][0]+' doğru yerde.');speak('Tebrikler! Doğru yerleştirdin.');if(done.size===5){$('next').hidden=false;msg(level===2?'🏆 Şehrin güvenli! Trafik Mimarı görevini tamamladın.':'Bölge güvenli! Yeni bölgenin kilidi açıldı.');$('next').textContent=level===2?'Yeniden oyna':'Sonraki bölge →'}}function render(){$('level').textContent='Bölge '+(level+1)+' / 3 · '+levels[level].name;$('score').textContent='⭐ '+score+' / 15';$('bar').style.width=score/15*100+'%';$('scene').innerHTML=city();levels[level].spots.forEach((s,i)=>{let b=document.createElement('button');b.className='spot'+(done.has(i)?' done':'');b.style.left=s[0]+'%';b.style.top=s[1]+'%';b.innerHTML=done.has(i)?sign(s[2]):'?';b.title=s[3];b.onclick=()=>place(i,selected);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();place(i,e.dataTransfer.getData('text/plain'))};$('scene').append(b)});$('tray').innerHTML='';let ids=levels[level].spots.map(s=>s[2]).sort();ids.forEach(id=>{let b=document.createElement('button');b.className='tile'+(selected===id?' selected':'')+(levels[level].spots.some((s,i)=>s[2]===id&&done.has(i))?' used':'');b.innerHTML=sign(id)+signs[id][0];b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',id);b.onclick=()=>{selected=id;render();msg(signs[id][0]+' seçildi. Şehirde uygun noktayı bul.')};$('tray').append(b)})}$('next').onclick=()=>{if(level===2){level=score=0}else level++;done.clear();selected=null;$('next').hidden=true;render();msg('Yeni bölgeye hoş geldin! Soru işaretlerine dokunarak ipucu al.')};render();msg('Soru işaretlerine dokunarak ipucu al veya levhayı uygun yere sürükle.');</script></html>
