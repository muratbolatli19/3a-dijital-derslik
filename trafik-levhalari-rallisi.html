<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trafik Levhaları Rallisi</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#fff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#192b40;border-radius:15px}header img{width:120px;background:white;border-radius:8px}h1{margin:0;font-size:24px}button,a{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:12px;background:#eaf2ff;color:#172638;text-decoration:none;touch-action:none}#stage{position:relative;overflow:hidden;border-radius:16px;margin-top:10px;background:#8bc5e8}canvas{display:block;width:100%;aspect-ratio:16/9}#hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#hud div{background:#101923d9;padding:10px 15px;border-radius:12px;font-weight:bold}#notice{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#101923d9;padding:9px 15px;border-radius:12px;text-align:center;max-width:90%}#overlay{position:absolute;inset:0;background:#0a1728b8;display:grid;place-items:center;text-align:center}#overlay[hidden]{display:none}#overlay div{background:#172b42e8;border:1px solid #ffffff44;border-radius:20px;padding:24px;max-width:380px}#start{background:#ffd15c}#controls{display:flex;justify-content:center;gap:12px;margin:12px}#controls button{flex:1;max-width:220px;min-height:60px;font-size:20px}#brake{background:#ff9b9b}small{color:#bacbdf}#quiz{background:#192b40;border-radius:16px;padding:16px;margin-top:10px}#question{font-size:clamp(17px,2.5vw,24px);margin:0 0 12px}#answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}#answers button{min-height:85px;display:grid;place-items:center}#answers svg{width:72px;height:72px}#answers button.good{background:#80dfab}#answers button.bad{background:#ff9999}#feedback{min-height:24px;margin-bottom:0}canvas{aspect-ratio:960/440;max-height: min(56vh,440px);object-fit:fill} @media(max-width:600px){#answers{grid-template-columns:repeat(2,1fr)}header img{width:90px}} main{padding:6px;max-width:1100px}header{padding:7px 12px}header img{width:95px}h1{font-size:20px}#stage{margin-top:6px}#quiz{padding:10px;margin-top:6px}#question{margin-bottom:7px;font-size:19px}#answers button{min-height:66px;padding:5px}#answers svg{width:58px;height:58px}#feedback{margin:5px 0 0;min-height:20px}#hud div{padding:6px 10px}#notice{top:48px} </style><main><header><a href="derslik.html">← Derslik</a><div><h1>TRAFİK LEVHALARI RALLİSİ</h1><small>Güvenli sürüş · Bilginle ilerle</small></div><img src="dijital-derslik-logo-seffaf.png" alt="Süleymaniye Okulları"></header><div id="stage"><canvas id="c" width="960" height="540"></canvas><div id="hud"><div id="speed">0 km/sa</div><div id="distance">Görev 0 / 10</div><div id="score">⭐ 0</div></div><div id="notice">Bilginle ilerle!</div><div id="overlay"><div><h2 id="title">Doğa Parkuru</h2><p id="desc">Doğru cevaplarla hız kazan, 10 görevi tamamla!</p><button id="start">YARIŞA BAŞLA</button></div></div></div><section id="quiz"><h2 id="question">Yarışa başla!</h2><div id="answers"></div><p id="feedback" aria-live="polite"></p></section></main><script>const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),W=960,H=540,horizon=190,far=600;let lane=0,px=0,speed=0,dist=0,score=0,active=false,brake=false,last=0,traffic=[],nextSpawn=0,noticeUntil=0,hitUntil=0;const palette=['#b73535','#c5c8ce','#e7aa31','#345f9d','#34434b'];function poly(p,color){g.fillStyle=color;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function rect(x,y,w,h,color,r=0){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function project(z){let t=1-Math.max(0,Math.min(far,z))/far;let p=t*t;return {y:horizon+p*(H-horizon),w:18+p*470,s:.05+p*.95}}function car(x,y,s,color){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#0005';g.beginPath();g.ellipse(0,5,69,13,0,0,7);g.fill();rect(-62,-36,19,43,'#151a20',6);rect(43,-36,19,43,'#151a20',6);let grad=g.createLinearGradient(0,-85,0,0);grad.addColorStop(0,'#ffffff');grad.addColorStop(.13,color);grad.addColorStop(.7,color);grad.addColorStop(1,'#151c26');poly([[-62,-13],[-60,-45],[-42,-63],[-30,-83],[30,-83],[42,-63],[60,-45],[62,-13],[48,0],[-48,0]],grad);poly([[-34,-77],[34,-77],[44,-49],[-44,-49]],'#263b4d');poly([[-30,-74],[30,-74],[36,-61],[-36,-61]],'#7896aa');rect(-57,-36,35,9,'#ff3434',3);rect(22,-36,35,9,'#ff3434',3);rect(-55,-33,31,3,'#ff9c8d',1);rect(24,-33,31,3,'#ff9c8d',1);rect(-19,-23,38,11,'#e8e9df',2);rect(-48,-9,96,5,'#1a2028',2);rect(-50,-5,14,5,'#8b9299',2);rect(36,-5,14,5,'#8b9299',2);g.restore()}function drawPlayer(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#0007';g.beginPath();g.ellipse(0,2,73,12,0,0,Math.PI*2);g.fill();rect(-65,-29,20,33,'#11151b',6);rect(45,-29,20,33,'#11151b',6);let paint=g.createLinearGradient(0,-90,0,0);paint.addColorStop(0,'#d9e9f5');paint.addColorStop(.18,'#8babc8');paint.addColorStop(.46,'#2765a3');paint.addColorStop(.7,'#123b70');paint.addColorStop(1,'#081a2d');poly([[-67,-14],[-66,-42],[-56,-55],[-43,-65],[-32,-86],[32,-86],[43,-65],[56,-55],[66,-42],[67,-14],[55,-3],[-55,-3]],paint);let glass=g.createLinearGradient(0,-83,0,-48);glass.addColorStop(0,'#9fb5c4');glass.addColorStop(.4,'#40586b');glass.addColorStop(1,'#172431');poly([[-30,-82],[30,-82],[43,-57],[-43,-57]],glass);poly([[-29,-80],[29,-80],[33,-73],[-33,-73]],'#c5d8e355');poly([[-56,-51],[56,-51],[62,-40],[-62,-40]],'#357ab4');rect(-60,-37,120,8,'#18212c',3);rect(-58,-36,37,6,'#ef263c',2);rect(21,-36,37,6,'#ef263c',2);rect(-56,-35,33,2,'#ff9e9c',1);rect(23,-35,33,2,'#ff9e9c',1);rect(-21,-25,42,13,'#e9e9e3',2);g.fillStyle='#273341';g.font='7px sans-serif';g.textAlign='center';g.fillText('06 RALLI',0,-16);rect(-59,-10,118,7,'#151c24',2);rect(-51,-8,16,5,'#a9b1b7',2);rect(35,-8,16,5,'#a9b1b7',2);g.restore()}function tree(x,y,s){g.save();g.translate(x,y);g.scale(s,s);rect(-4,-38,8,38,'#765740');for(let [a,b,r,col] of [[0,-57,26,'#32653a'],[-14,-48,19,'#437c43'],[12,-48,20,'#508d48'],[-4,-65,17,'#669c51']]){g.fillStyle=col;g.beginPath();g.arc(a,b,r,0,7);g.fill()}g.restore()}function road(){let sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#68a9d9');sky.addColorStop(1,'#e0eff6');rect(0,0,W,horizon,sky);for(let i=0;i<5;i++)poly([[i*230-100,horizon],[i*230+60,70+(i%2)*40],[i*230+220,horizon]],i%2?'#779ca4':'#8baeb5');rect(0,horizon,W,H-horizon,'#75964c');for(let z=far;z>0;z-=6){let a=project(z),b=project(z-6),stripe=Math.floor((z+dist)/14)%2;rect(0,a.y,W,b.y-a.y+2,stripe?'#78994e':'#7b9c50');poly([[W/2-a.w-8,a.y],[W/2+a.w+8,a.y],[W/2+b.w+12,b.y],[W/2-b.w-12,b.y]],stripe?'#d6d1bf':'#aeb3a6');poly([[W/2-a.w,a.y],[W/2+a.w,a.y],[W/2+b.w,b.y],[W/2-b.w,b.y]],'#454b52');for(let side of [-1,1]){let x=W/2+side*a.w*.96,xx=W/2+side*b.w*.96;poly([[x-1,a.y],[x+1,a.y],[xx+3,b.y],[xx-3,b.y]],'#f4f3e8')}if(stripe)for(let side of [-1,1]){let x=W/2+side*a.w/3,xx=W/2+side*b.w/3;poly([[x-1,a.y],[x+1,a.y],[xx+3,b.y],[xx-3,b.y]],'#e8e6d8')}}for(let z of Array.from({length:18},(_,i)=>far-((dist+i*37)%far)).sort((a,b)=>b-a)){let p=project(z);for(let side of [-1,1])tree(W/2+side*(p.w+35*p.s+12),p.y,p.s*1.8)}}const signs={school:['Okul geçidi','triangle','<circle cx="43" cy="34" r="5"/><circle cx="60" cy="39" r="4"/><path d="M43 40v16l-9 12m9-12 10 12m-10-24 13 5m4-5v12l-6 9m6-9 8 9" stroke="#111" stroke-width="4" fill="none"/>'],ped:['Yaya geçidi','blue','<path d="M10 84 50 12 90 84Z" fill="white"/><g stroke="#111" stroke-width="4"><path d="M25 78h9m5 0h9m5 0h9m5 0h9"/><path d="M50 43 44 58 34 71m10-13 15 13m-9-28-12 10m12-10 12 9" fill="none"/></g><circle cx="51" cy="35" r="5"/>'],stop:['DUR','stop','<text x="50" y="58" text-anchor="middle" fill="white" font-size="26" font-weight="bold">DUR</text>'],noentry:['Girilmez','red','<rect x="18" y="42" width="64" height="16" rx="2" fill="white"/>'],parking:['Park etmek yasaktır','ban','<path d="M19 19 81 81" stroke="#e32d38" stroke-width="9"/>'],bike:['Bisiklet yolu','circle','<g stroke="white" stroke-width="4" fill="none"><circle cx="30" cy="62" r="15"/><circle cx="72" cy="62" r="15"/><path d="M30 62 45 40 58 62 30 62 49 62 65 34 72 62M59 34h14M39 40h12"/></g>'],works:['Yol çalışması','triangle','<circle cx="43" cy="37" r="5"/><path d="M43 43 54 54 43 68m11-14 10 14m-21-25-10 14m0 0 28 12" stroke="#111" stroke-width="5" fill="none"/><path d="M62 73 72 59 82 73Z"/>'],speed:['Hız sınırı 30','limit','<text x="50" y="65" text-anchor="middle" font-size="40" font-weight="bold">30</text>'],hospital:['Hastane','blue','<text x="50" y="68" text-anchor="middle" font-size="52" fill="white" font-weight="bold">H</text>'],lights:['Işıklı işaret cihazı','triangle','<rect x="39" y="30" width="22" height="43" rx="4" fill="#222"/><circle cx="50" cy="39" r="5" fill="#e33"/><circle cx="50" cy="51" r="5" fill="#f5b72d"/><circle cx="50" cy="63" r="5" fill="#3a5"/>']};function sign(id){let [name,type,inner]=signs[id];let base=type==='triangle'?'<path d="M50 7 95 86H5Z" fill="white" stroke="#d92d38" stroke-width="8" stroke-linejoin="round"/>':type==='stop'?'<path d="M30 5H70L95 30V70L70 95H30L5 70V30Z" fill="#d92d38" stroke="white" stroke-width="3"/>':type==='blue'?'<rect x="5" y="5" width="90" height="90" rx="4" fill="#1765b2"/>':'<circle cx="50" cy="50" r="44" fill="'+(type==='red'?'#d92d38':type==='limit'?'white':'#1765b2')+'" stroke="'+(type==='limit'||type==='ban'?'#d92d38':'white')+'" stroke-width="8"/>';return '<svg viewBox="0 0 100 100" aria-label="'+name+'">'+base+inner+'</svg>'}const bank=[['stop','Araçların tamamen durmasını hangi levha bildirir?'],['ped','Yayaların karşıya geçebileceği yeri hangi levha gösterir?'],['school','Okul geçidine yaklaşıldığını hangi levha bildirir?'],['noentry','Araçların girmesinin yasak olduğu yolu hangi levha gösterir?'],['parking','Park etmenin yasak olduğu yeri hangi levha bildirir?'],['bike','Bisikletlilere ayrılmış yolu hangi levha gösterir?'],['works','Yolda çalışma olduğunu hangi levha bildirir?'],['speed','En fazla 30 km/sa hızla gidilebileceğini hangi levha gösterir?'],['hospital','Hastaneyi hangi levha gösterir?'],['lights','İleride trafik ışıkları olduğunu hangi levha bildirir?']];let index=0,streak=0,target=0,locked=false,questions=[],correct=0;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function speak(t){if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}}function show(){locked=false;let [id,q,reverse]=questions[index];$('question').innerHTML=reverse?'Bu levhanın anlamı nedir? <span style="display:inline-block;width:55px;vertical-align:middle">'+sign(id)+'</span>':q;$('answers').innerHTML='';for(let k of shuffle([id,...shuffle(Object.keys(signs).filter(x=>x!==id)).slice(0,3)])){let b=document.createElement('button');b.innerHTML=reverse?signs[k][0]:sign(k);b.setAttribute('aria-label',signs[k][0]);b.onclick=()=>{if(locked)return;locked=true;let ok=k===id;b.classList.add(ok?'good':'bad');if(ok){correct++;streak++;score+=10+(streak%3===0?5:0);target=Math.min(60,target+6);$('feedback').textContent='Tebrikler! +'+(streak%3===0?15:10)+' puan';speak('Tebrikler!');engine()}else{streak=0;target=Math.max(15,target-15);$('feedback').textContent='Doğru cevap: '+signs[id][0];speak('Doğru cevap '+signs[id][0])}setTimeout(()=>{index++;if(index===10){active=false;target=0;$('title').textContent='🏆 Ralli tamamlandı';$('desc').textContent=correct+' / 10 doğru · '+score+' puan';$('start').textContent='YENİDEN OYNA';$('overlay').hidden=false;$('answers').innerHTML='';return}show()},1250)};$('answers').append(b)}}let audio,osc,osc2,filter,volume;function engine(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();if(osc)return;osc=audio.createOscillator();osc2=audio.createOscillator();filter=audio.createBiquadFilter();volume=audio.createGain();osc.type='sawtooth';osc2.type='triangle';filter.type='lowpass';filter.frequency.value=180;volume.gain.value=0;osc.connect(filter);osc2.connect(filter);filter.connect(volume);volume.connect(audio.destination);osc.start();osc2.start()}catch(e){}}function updateEngine(){if(!osc)return;let t=audio.currentTime;osc.frequency.setTargetAtTime(35+speed*1.4,t,.15);osc2.frequency.setTargetAtTime(70+speed*2.8,t,.15);filter.frequency.setTargetAtTime(120+speed*8,t,.2);volume.gain.setTargetAtTime(active&&!document.hidden?(0.012+speed*.00055):0,t,.15)}function reset(){engine();index=score=correct=streak=dist=0;target=30;speed=0;questions=shuffle(bank).map((x,i)=>[...x,i%2===1]);active=true;$('overlay').hidden=true;$('feedback').textContent='';show()}function loop(now){requestAnimationFrame(loop);let dt=Math.min(.04,(now-last)/1000||.016);last=now;speed+=(target-speed)*Math.min(1,dt*2);updateEngine();if(active)dist+=speed/3.6*dt*4;road();drawPlayer(W/2+145,H-24,1.45);$('speed').textContent=Math.round(speed)+' km/sa';$('distance').textContent='Görev '+Math.min(10,index+1)+' / 10';$('score').textContent='⭐ '+score;$('notice').textContent=active?'Doğru cevapla hız kazan!':'Güvenli sürüş rallisi'}$('start').onclick=reset;requestAnimationFrame(loop);</script></html>
