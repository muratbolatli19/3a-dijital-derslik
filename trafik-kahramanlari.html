<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trafik Kahramanları</title><style>*{box-sizing:border-box}body{margin:0;font:18px system-ui;background:linear-gradient(135deg,#e4f7ff,#f7e2bd);color:#303052}main{max-width:1050px;margin:auto;padding:12px}header{text-align:center;background:linear-gradient(125deg,#3945aa,#8054cf 65%,#ed83b2);color:white;border:4px solid white;border-radius:26px;padding:20px}header h1{font-size:clamp(28px,5vw,50px);margin:8px}header .toolbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hero-brand{width:170px;height:62px;object-fit:contain;background:white;border-radius:16px;padding:5px}.hero-art{font-size:38px}button,a{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:12px;background:#fff;color:#303052;text-decoration:none;cursor:pointer}section{background:white;border-radius:24px;padding:18px;margin:16px 0;text-align:center}.cards{display:flex;gap:12px;flex-wrap:wrap}.cards button{flex:1;min-width:180px;background:#bdecc9;padding:25px;box-shadow:0 6px #79ba91}.cards button:nth-child(2){background:#c9ddff;box-shadow:0 6px #8aa8d6}.cards button:nth-child(3){background:#ffe0a1;box-shadow:0 6px #d6ae66}.cards span{display:block;font-size:56px}canvas{width:100%;display:block;touch-action:none;border-radius:20px}#stats{background:#e0f6eb;border-radius:12px;padding:10px;font-weight:bold}#goal{background:#fff1b9;border-radius:12px;padding:12px;font-weight:bold}#feedback{min-height:32px;font-weight:bold}#next{background:#ffd263}[hidden]{display:none!important}body{background:linear-gradient(120deg,#b5eaff,#e1f6b8)}.cards button{min-height:160px}#field{border:4px solid #b2d8b0}#actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px}#actions button{background:#dcecff;border:2px solid #a9c4e8}#feedback{color:#245a37}</style><main><header><div class="toolbar"><a href="oyun-test-merkezi.html?section=games">← Oyunlar</a> <button id="sound">🔊 Ses açık</button> <button id="full">⛶ Tam ekran</button></div><div class="hero-art">🚦 🚗 🏫</div><img class="hero-brand" src="dijital-derslik-logo-seffaf.png" alt="Süleymaniye Okulları"><h1>🚦 Trafik Kahramanları</h1><p>Güvenli Şehir · Kuralları öğren, şehri koru!</p><p id="playerName">Süleymaniye Okulları · 3. Sınıf</p></header><section id="menu"><h2>🏙️ Şehrin güvenliği sana emanet!</h2><div class="cards"><button data-mode="0"><span>🚶</span>Güvenli Yolculuk<br>10 görev</button><button data-mode="1"><span>🚸</span>Trafik Levhaları<br>10 görev</button><button data-mode="2"><span>👮</span>Trafik Polisi<br>10 görev</button></div></section><section id="game" hidden><div id="stats"></div><p id="goal"></p><canvas id="field" width="900" height="510"></canvas><div id="actions"></div><p id="feedback" role="status"></p><button id="next" hidden>Sonraki görev ➜</button> <button id="home">← Menü</button></section><section id="result" hidden><h1>🏆 Şehrin Trafik Kahramanı!</h1><p id="resultText"></p><button id="again">Tekrar oyna</button> <button id="menuBack">Menü</button></section></main><script>const $=id=>document.getElementById(id),c=$('field'),g=c.getContext('2d');let studentFirstName='arkadaşım',mode=0,i=0,stars=0,errors=0,sound=true,locked=false,phase=0,drag=null,walk=0,signal=0,car=0,choice=[],order=[],t0=0;const signs=[{n:'DUR',icon:'🛑',clue:'Araçların tamamen durması gereken kavşak.'},{n:'Yaya geçidi',icon:'🚸',clue:'Yayaların karşıya geçmesi için ayrılan çizgili alan.'},{n:'Bisiklet yolu',icon:'🚲',clue:'Bisikletlilere ayrılmış yol.'},{n:'Girilmez',icon:'⛔',clue:'Araçların bu yönden girmesinin yasak olduğu yol.'},{n:'Park yasaktır',icon:'🚫',clue:'Araçların park etmemesi gereken alan.'}];function speak(t){if(sound&&window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}}function show(id){['menu','game','result'].forEach(x=>$(x).hidden=x!==id)}function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function start(m){mode=m;i=stars=errors=0;order=[...shuffle(signs),...shuffle(signs)];show('game');render()}function btn(t,f){let b=document.createElement('button');b.textContent=t;b.onclick=f;$('actions').append(b)}function render(){locked=false;phase=0;walk=0;drag=null;signal=i%2;choice=shuffle([order[i],...shuffle(signs.filter(s=>s!==order[i])).slice(0,2)]);$('stats').textContent='Görev '+(i+1)+'/10 · ⭐ '+stars;$('feedback').textContent='';$('next').hidden=true;$('actions').replaceChildren();if(mode===0){$('goal').textContent='Yaya geçidinden güvenle okula ulaş!';btn('👀 Sola ve sağa bak',()=>{if(locked)return;phase=1;$('feedback').textContent='Yolu kontrol ettin. Yaya ışığına dikkat!'});btn('✋ Bekle',()=>{if(locked)return;if(signal===0){signal=1;$('feedback').textContent='Yaya ışığı yeşil oldu. Yolu yeniden kontrol et!';phase=0}else $('feedback').textContent='Yol güvenliyse geçebilirsin.'});btn('🚶 Karşıya geç',()=>{if(locked)return;if(signal===1&&phase===1){walk=1;win('Yeşil yaya ışığında yolu kontrol ederek geçtin.')}else wrong('Önce yeşil yaya ışığını bekle ve yolu kontrol et.')})}else if(mode===1){$('goal').textContent=order[i].clue+' Uygun levhayı boş direğe sürükle.'}else{$('goal').textContent=i%2?'Araçlar bekliyor. Yaya geçidini boşalt ve araçlara geçiş ver.':'Yaya karşıya geçmek istiyor. Araçları durdur ve yayaya geçiş ver.';btn('🔴 Araçları durdur',()=>{if(locked)return;signal=1;phase=1;$('feedback').textContent='Araç ışığı kırmızı, yaya ışığı yeşil.'});btn('🚶 Yayayı geçir',()=>{if(locked)return;if(signal===1&&phase===1){walk=1;phase=2;if(i%2===0)win('Araçlar durdu, yaya güvenle geçti.');else $('feedback').textContent='Yaya geçti. Şimdi araçlara geçiş ver.'}else wrong('Yaya geçmeden önce araçları durdur.')});btn('🟢 Araçları geçir',()=>{if(locked)return;if(i%2===1&&phase===2){signal=0;win('Yaya geçidi boş, araçlar güvenle ilerliyor.')}else wrong('Önce yayanın geçişini tamamla.')})}}function rect(x,y,w,h,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,10);g.fill()}function txt(t,x,y,s=24,col='#253b4b'){g.font='bold '+s+'px system-ui';g.fillStyle=col;g.textAlign='center';g.fillText(t,x,y)}function tree(x,y){rect(x-6,y,12,38,'#886345');g.fillStyle='#3aab66';g.beginPath();g.arc(x,y,28,0,7);g.fill()}function light(x,y,green){rect(x,y,44,90,'#263545');for(let k=0;k<2;k++){g.fillStyle=k===0?(green?'#683b3b':'#ff5252'):(green?'#43e879':'#355a42');g.beginPath();g.arc(x+22,y+24+k*42,14,0,7);g.fill()}}function draw(){g.fillStyle='#a8dc91';g.fillRect(0,0,900,510);rect(0,0,900,110,'#a6e5ff');for(let k=0;k<4;k++){let x=30+k*130;rect(x,35,95,105,['#f6b5a6','#f9dc8b','#b8c5f5','#a8dcd4'][k]);for(let j=0;j<3;j++)rect(x+12+j*25,55,16,23,'#fff8ce')}rect(620,22,235,122,'#ffe3a1');txt('🏫 OKUL',737,75,33);rect(0,150,900,55,'#e9e4d6');rect(0,205,900,180,'#475461');rect(0,385,900,55,'#e9e4d6');for(let x=0;x<900;x+=80)rect(x,291,44,5,'#ffe69b');for(let y=210;y<380;y+=27)rect(410,y,80,15,'#fff');for(let x of [80,210,700,830])tree(x,465);light(500,108,signal===1);txt('YAYA',522,100,16);light(355,385,signal===0);txt('ARAÇ',377,490,16);if(signal===0)car=(car+2.5)%1050;let x=signal===0?car-80:290;txt('🚗',x,265,65);txt('🚙',signal===0?980-car:610,355,65);if(mode!==1){let y=walk?Math.max(173,410-(performance.now()-t0)/6):420;txt('🚶',450,y,48)}else{rect(535,155,10,52,'#63717c');rect(510,115,60,55,'#fff');txt(locked?order[i].icon:'?',540,155,38);choice.forEach((s,k)=>{if(drag&&drag.k===k)return;let x=150+k*300;rect(x-115,440,230,65,'#fff');txt(s.icon+' '+s.n,x,481,23)});if(drag){rect(drag.x-110,drag.y-30,220,60,'#fff');txt(choice[drag.k].icon+' '+choice[drag.k].n,drag.x,drag.y+8,22)}}requestAnimationFrame(draw)}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*510/r.height}}c.onpointerdown=e=>{if(mode!==1||locked)return;let p=point(e),k=choice.findIndex((_,k)=>Math.abs(p.x-(150+k*300))<115&&p.y>440);if(k>=0){drag={...p,k};c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(drag)drag={...point(e),k:drag.k}};c.onpointercancel=()=>drag=null;c.onpointerup=e=>{if(!drag)return;let p=point(e),s=choice[drag.k];drag=null;if(Math.hypot(p.x-540,p.y-145)<90){if(s===order[i])win('Doğru levhayı yerleştirdin: '+s.n);else wrong('Levhanın anlamını tekrar düşün.')}};function wrong(t){errors++;$('feedback').textContent=t;speak('Tekrar dene '+studentFirstName+'. '+t)}function win(t){locked=true;stars++;t0=performance.now();$('stats').textContent='Görev '+(i+1)+'/10 · ⭐ '+stars;$('feedback').textContent='🌟 '+t;speak('Tebrikler '+studentFirstName+'! '+t);$('next').hidden=false}$('next').onclick=()=>{if(++i<10)return render();show('result');$('resultText').textContent=stars+' yıldız · '+errors+' yanlış deneme'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(+b.dataset.mode));$('again').onclick=()=>start(mode);$('home').onclick=$('menuBack').onclick=()=>show('menu');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Ses açık':'🔇 Ses kapalı'};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();function setPlayerName(display){if(typeof display!=='string'||!display.trim())return;const first=display.trim().split(/\s+/)[0];studentFirstName=first.charAt(0).toLocaleUpperCase('tr-TR')+first.slice(1).toLocaleLowerCase('tr-TR');$('playerName').textContent='👩‍🚀 Oyuncu: '+studentFirstName;}
(async()=>{try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm');const db=createClient('https://zhmkyfouskthqgrhvhqp.supabase.co','sb_publishable_YcqB4BO9knYzHk4KKLye3A_ilBb6I9u',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let {data:{user}}=await db.auth.getUser();if(!user){const {data:{session}}=await db.auth.getSession();user=session?.user}if(user){const {data,error}=await db.from('profiles').select('display_name,role,active').eq('id',user.id).maybeSingle();if(!error&&data?.role==='student'&&data.active)setPlayerName(data.display_name);}}catch(e){console.warn('Öğrenci adı alınamadı',e)}if(studentFirstName==='arkadaşım')$('playerName').textContent='👤 Adın görünmüyor mu? Adımı düzelt düğmesine bas.';})();
draw();</script></html>
