<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3/A Oyun ve Test Merkezi</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f4eaff,#e6f7ff);font:17px system-ui;color:#273456}header{background:linear-gradient(100deg,#5040b6,#168fb4);padding:23px;color:white}main{max-width:980px;margin:auto;padding:20px}.panel{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 20px #3333}button{border:0;border-radius:12px;background:#5548c8;color:white;padding:12px 18px;margin:6px;cursor:pointer;font-weight:700}button:disabled{opacity:.5}.option{display:block;width:95%;text-align:left;background:#e9f1ff;color:#273456;border:2px solid #b9d3ed}.option.selected{outline:3px solid #5040b6}.hidden{display:none}.rank{display:flex;justify-content:space-between;border-bottom:1px solid #e1e8f2;padding:12px}.mine{background:#fff4cc;font-weight:bold}a{color:#3256bd}</style></head><body><header><h1>🎮 3/A Oyun ve Test Merkezi</h1><p>Öğren · Çöz · Puan Kazan · Kendi Sıranı Gör</p></header><main><a href="derslik.html">← Dersliğe dön</a><div id="message" class="panel">Oturum kontrol ediliyor...</div><section id="app" class="hidden"><div class="panel"><h2>🏆 Yıldız Ligi</h2><div id="board"></div></div><div class="panel"><h2>🎮 Ders Oyunları</h2><p>Tamamlanan her ders etkinliğinden 10 ek puan kazanılır.</p><a href="derslik.html"><button type="button">Ders oyunlarına git</button></a></div><div class="panel"><h2>📝 Online Testler ve PDF'ler</h2><div id="tests"></div></div><div id="quiz" class="panel hidden"><h2 id="quizTitle"></h2><div id="questions"></div><button id="submit" type="button">Testi bitir ve puanımı kaydet</button><button type="button" id="cancel">Test listesini göster</button></div></section></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const db=createClient('https://zhmkyfouskthqgrhvhqp.supabase.co','sb_publishable_YcqB4BO9knYzHk4KKLye3A_ilBb6I9u');
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session,active=null,answers=[];
async function api(payload){const r=await fetch('https://zhmkyfouskthqgrhvhqp.supabase.co/functions/v1/online-test-api',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:'sb_publishable_YcqB4BO9knYzHk4KKLye3A_ilBb6I9u','Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||'İşlem başarısız');return j}
async function leaderboard(){const{data,error}=await db.rpc('anonymous_test_leaderboard');if(error)throw error;$('board').innerHTML=(data||[]).map(x=>'<div class="rank '+(x.is_me?'mine':'')+'"><span>'+(x.is_me?'⭐ Benim sıram: ':'')+x.rank+'. sıra</span><strong>'+x.points+' puan</strong></div>').join('')||'Henüz puan yok.'}
async function load(){const {tests}=await api({action:'list'});$('tests').innerHTML='';for(const t of tests){const p=document.createElement('div');p.className='panel';p.innerHTML='<h3>'+esc(t.subject)+' · '+esc(t.title)+'</h3><p>'+t.questions.length+' soru</p>';if(t.pdf_url){const a=document.createElement('a');a.href=t.pdf_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='📥 PDF indir';p.append(a)}const b=document.createElement('button');b.textContent=t.questions.length?'Testi çöz':'Yalnızca PDF';b.disabled=!t.questions.length;b.onclick=()=>start(t);p.append(b);$('tests').append(p)}if(!tests.length)$('tests').textContent='Henüz yayımlanmış test yok.'}
function start(t){active=t;answers=Array(t.questions.length).fill(null);$('quizTitle').textContent=t.title;$('questions').replaceChildren();t.questions.forEach((q,i)=>{const p=document.createElement('div');p.className='panel';const h=document.createElement('h3');h.textContent=(i+1)+'. '+q.prompt;p.append(h);(q.options||[]).forEach((o,k)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+k)+') '+o;b.onclick=()=>{answers[i]=k;p.querySelectorAll('button').forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};p.append(b)});$('questions').append(p)});$('quiz').classList.remove('hidden');$('quiz').scrollIntoView({behavior:'smooth'})}
$('cancel').onclick=()=>{$('quiz').classList.add('hidden')};
$('submit').onclick=async()=>{if(answers.some(x=>x===null)){alert('Bütün soruları cevaplayın.');return}const b=$('submit');b.disabled=true;try{const r=await api({action:'submit',test_id:active.id,answers});alert(r.correct+'/'+r.total+' doğru · '+r.score+' puan kazandın!');$('quiz').classList.add('hidden');await leaderboard()}catch(e){alert(e.message)}finally{b.disabled=false}};
async function init(){const {data:{session:s}}=await db.auth.getSession();if(!s){$('message').textContent='Derslikten öğrenci hesabınızla giriş yapın.';return}session=s;try{await Promise.all([load(),leaderboard()]);$('message').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('message').textContent='Merkez açılamadı: '+e.message}}init();
</script></body></html>
