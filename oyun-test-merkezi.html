<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3/A Oyun ve Test Merkezi</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f4eaff,#e6f7ff);font:17px system-ui;color:#273456}header{background:linear-gradient(100deg,#5040b6,#168fb4);padding:23px;color:white}main{max-width:980px;margin:auto;padding:20px}.panel{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 20px #3333}button{border:0;border-radius:12px;background:#5548c8;color:white;padding:12px 18px;margin:6px;cursor:pointer;font-weight:700}button:disabled{opacity:.5}.option{display:block;width:95%;text-align:left;background:#e9f1ff;color:#273456;border:2px solid #b9d3ed}.option.selected{outline:3px solid #5040b6}.hidden{display:none}.rank{display:flex;justify-content:space-between;border-bottom:1px solid #e1e8f2;padding:12px}.mine{background:#fff4cc;font-weight:bold}a{color:#3256bd}.hub-section.hidden{display:none!important}.hub-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.hub-nav a{padding:10px 15px;border-radius:12px;background:white;text-decoration:none;font-weight:750;border:1px solid #d7dcfa}.hub-nav a.active{background:#514cc5;color:white}@media(max-width:600px){.hub-nav a{flex:1;text-align:center}}.subject-fold{border:2px solid #e3dcff;background:linear-gradient(120deg,#fff,#f4f5ff);border-radius:17px;margin:14px 0;padding:14px}.subject-fold>summary{font-size:20px;font-weight:850;color:#42398c;cursor:pointer;padding:9px}.subject-fold>p{margin:12px}.test-card{border-radius:14px;padding:14px 18px;background:#eef7ff;margin:12px 0}.test-download{display:inline-block;padding:12px 16px;background:#514bc2;color:white;border-radius:12px;text-decoration:none;font-weight:750}.embedded{background:transparent}.embedded main{padding:0;max-width:100%}.embedded .panel{box-shadow:none;border:1px solid #e3dcff}.embedded .hub-section{background:linear-gradient(125deg,#f4edff,#eaf8ff)}.embedded h2{font-size:27px;color:#392e98}.quiz-state{display:inline-block;padding:9px 12px;border-radius:12px;background:#e9f7ef;color:#245f4a;font-weight:800;font-size:15px}.test-card:has(button:not(:disabled)) .quiz-state{background:#ecf0ff;color:#465480}.result-summary{padding:14px;background:#e5f4ff;border-radius:12px;font-size:21px;font-weight:800}.review-card{padding:15px 18px;border-radius:14px;margin:12px 0;border-left:6px solid #4f75ca;background:#f2f6ff}.review-correct{background:#edfaf3;border-color:#28a36e}.review-incorrect{background:#fff0e9;border-color:#ed8643}.review-card p{margin:8px 0}.review-card small{display:block;color:#4c5780;font-weight:700}.outcome-result{padding:10px 14px;background:#eff3ff;border-radius:11px;font-weight:750} .review-card .answer-wrong{color:#b42318;font-weight:850;background:#ffe3df;border-left:5px solid #d92d20;border-radius:7px;padding:9px 12px}.review-card .answer-correct{color:#087443;font-weight:850;background:#d9fbe8;border-left:5px solid #159957;border-radius:7px;padding:9px 12px}</style></head><body><header><h1>🎮 3/A Oyun ve Test Merkezi</h1><p>Öğren · Çöz · Puan Kazan · Kendi Sıranı Gör</p></header><main><a href="derslik.html">← Dersliğe dön</a><div id="message" class="panel">Oturum kontrol ediliyor...</div><section id="app" class="hidden"><div class="panel voice-panel"><label><input id="voiceOn" type="checkbox" checked> 🔊 Sesli tebrik ve geri bildirim</label></div><div class="panel hub-section" data-hub-section="league"><h2>🏆 Yıldız Ligi</h2><div id="board"></div></div><div class="panel hub-section" data-hub-section="games"><h2>🎮 Derslere Göre Oyunlar</h2><div id="readyGameList">Oyunlar yükleniyor...</div></div><div class="panel hub-section" data-hub-section="tests"><h2 id="testHeading">📝 Online Testler</h2><div id="tests"></div></div><div id="quizResult" data-hub-section="tests" class="panel hub-section hidden" role="status" aria-live="polite"></div><div id="quiz" data-hub-section="tests" class="panel hub-section hidden"><h2 id="quizTitle"></h2><div id="questions"></div><button id="submit" type="button">Testi bitir ve puanımı kaydet</button><button type="button" id="cancel">Test listesini göster</button></div></section></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
const db=createClient('https://zhmkyfouskthqgrhvhqp.supabase.co','sb_publishable_YcqB4BO9knYzHk4KKLye3A_ilBb6I9u');
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session,active=null,answers=[],studentName='Arkadaşım';
function say(message){if(!$('voiceOn').checked||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='tr-TR';u.rate=.92;window.speechSynthesis.speak(u)}

async function api(payload){const {data:{session:current}}=await db.auth.getSession();if(!current)throw Error('Oturum süresi doldu. Yeniden giriş yapın.');session=current;const r=await fetch('https://zhmkyfouskthqgrhvhqp.supabase.co/functions/v1/online-test-api',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:'sb_publishable_YcqB4BO9knYzHk4KKLye3A_ilBb6I9u','Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||'İşlem başarısız');return j}
async function leaderboard(){const{data,error}=await db.rpc('anonymous_test_leaderboard');if(error)throw error;$('board').innerHTML=(data||[]).map(x=>'<div class="rank '+(x.is_me?'mine':'')+'"><span>'+(x.is_me?'⭐ Benim sıram: ':'')+x.rank+'. sıra</span><strong>'+x.points+' puan</strong></div>').join('')||'Henüz puan yok.'}
async function loadGames(){
 const root=$('readyGameList');root.replaceChildren();
 const subjects=['Türkçe','Matematik','Fen Bilimleri','Hayat Bilgisi','Klasik Oyunlar'];
 let games=[];
 try{
  const response=await fetch('icerik-katalogu.json',{cache:'no-store'});
  if(!response.ok)throw Error('Katalog alınamadı');
  const catalog=await response.json();
  games=(catalog.items||[]).filter(item=>item.kind==='game'&&item.published===true&&item.visibility==='shared');
 }catch(e){
  root.textContent='Oyun kataloğu yüklenemedi. Sayfayı yenileyip tekrar deneyin.';
  console.warn('İçerik kataloğu:',e);return;
 }
 for(const subject of subjects){
  const fold=document.createElement('details');fold.className='subject-fold';fold.open=subject==='Klasik Oyunlar'||subject==='Türkçe';
  const head=document.createElement('summary');head.textContent=({'Türkçe':'📚','Matematik':'🧮','Fen Bilimleri':'🔬','Hayat Bilgisi':'🌱','Klasik Oyunlar':'🎲'}[subject])+' '+subject;fold.append(head);
  const entries=games.filter(item=>item.subject===subject);
  if(!entries.length){
   const empty=document.createElement('p');empty.textContent='Bu ders için henüz oyun yayınlanmadı. Yeni oyun öğretmeniniz tarafından hazırlanacak.';fold.append(empty);
  }
  for(const entry of entries){
   const item=document.createElement('div');item.className='test-card';
   const link=document.createElement('a');
   link.href=entry.url;link.target='_top';
   link.onclick=e=>{e.preventDefault();window.top.location.assign(link.href)};
   link.textContent=entry.title+' · Oyna';
   link.style.cssText='display:inline-block;font-weight:900;font-size:19px;padding:12px 0';
   const note=document.createElement('p');note.textContent=entry.description||'Oyunu başlat';item.append(link,note);fold.append(item);
  }
  root.append(fold);
 }
}
async function load(){
 const {tests}=await api({action:'list'});
 const {data:scores,error}=await db.from('test_scores').select('test_id,score').eq('student_id',session.user.id);if(error)throw error;
 const completed=new Map((scores||[]).map(x=>[x.test_id,x]));
 const tab=new URLSearchParams(location.search).get('tab')||'online',isPdf=tab==='pdf';
 $('testHeading').textContent=isPdf?'📥 İndirilebilir PDF Testler':'📝 Online Testler';
 const root=$('tests');root.replaceChildren();
 const items=(tests||[]).filter(t=>t.mode!=='game'&&(isPdf?!!t.pdf_url:t.questions.length>0));
 for(const subject of ['Türkçe','Matematik','Fen Bilimleri','Hayat Bilgisi']){
  const fold=document.createElement('details');fold.className='subject-fold';fold.open=false;
  const heading=document.createElement('summary');heading.textContent=({'Türkçe':'📚','Matematik':'🧮','Fen Bilimleri':'🔬','Hayat Bilgisi':'🌱'}[subject])+' '+subject;fold.append(heading);
  const matching=items.filter(t=>t.subject===subject);
  for(const t of matching){
   const p=document.createElement('div');p.className='test-card';const title=document.createElement('h3');title.textContent=t.title;p.append(title);
   const detail=document.createElement('p');detail.textContent=t.questions.length+' soru';p.append(detail);
   if(!isPdf){const state=document.createElement('p');state.className='quiz-state';const previous=completed.get(t.id);state.textContent=previous?'✅ Tamamlandı · '+previous.score+' puan':'⚪ Henüz başlanmadı';p.append(state)}
   if(isPdf){const a=document.createElement('a');a.href=t.pdf_url;a.target='_blank';a.rel='noopener noreferrer';a.className='test-download';a.textContent='📥 PDF dosyasını indir';p.append(a)}
   else{const button=document.createElement('button'),result=completed.get(t.id);button.textContent=result?'✅ Tamamlandı · '+result.score+' puan':'🚀 Testi çöz';button.disabled=!!result;button.onclick=()=>start(t);p.append(button)}
   fold.append(p);
  }
  if(!matching.length){const empty=document.createElement('p');empty.textContent='Bu derste henüz '+(isPdf?'PDF test':'online test')+' bulunmuyor.';fold.append(empty)}
  root.append(fold);
 }
}
function start(t){$('quizResult').classList.add('hidden');active=t;answers=Array(t.questions.length).fill(null);$('quizTitle').textContent=t.title;$('questions').replaceChildren();t.questions.forEach((q,i)=>{const p=document.createElement('div');p.className='panel';const h=document.createElement('h3');h.textContent=(i+1)+'. '+q.prompt;p.append(h);(q.options||[]).forEach((o,k)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+k)+') '+o;b.onclick=()=>{answers[i]=k;p.querySelectorAll('button').forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};p.append(b)});$('questions').append(p)});$('quiz').classList.remove('hidden');$('quiz').scrollIntoView({behavior:'smooth'})}
$('cancel').onclick=()=>{$('quiz').classList.add('hidden')};
$('submit').onclick=async()=>{if(answers.some(x=>x===null)){$('message').textContent='Bütün soruları cevaplayın.';$('message').classList.remove('hidden');return}$('message').classList.add('hidden');const b=$('submit');b.disabled=true;try{const r=await api({action:'submit',test_id:active.id,answers});const result=$('quizResult');result.replaceChildren();const h=document.createElement('h2');h.textContent='🎉 Test sonucun';const p=document.createElement('p');p.textContent=r.correct+'/'+r.total+' doğru · '+r.score+' puan';result.append(h,p);
 const percent=Math.round(100*r.correct/Math.max(1,r.total));
 const summary=document.createElement('p');summary.className='result-summary';summary.textContent='📊 Başarı oranı: %'+percent+' · '+(r.total-r.correct)+' yanlış';result.append(summary);
 if(Array.isArray(r.review)){
  const heading=document.createElement('h3');heading.textContent='🔎 Soru Soru Değerlendirmem';result.append(heading);
  const outcomes=new Map();
  r.review.forEach(item=>{
   const ok=item.selected_index===item.correct_index;
   const card=document.createElement('div');card.className='review-card '+(ok?'review-correct':'review-incorrect');
   const title=document.createElement('strong');title.textContent=(ok?'✅ ':'❌ ')+item.number+'. soru · '+(ok?'Doğru':'Tekrar çalış');card.append(title);
   const prompt=document.createElement('p');prompt.textContent=item.prompt;card.append(prompt);
   const formatAnswer=index=>Number.isInteger(index)&&index>=0&&index<(item.options||[]).length?String.fromCharCode(65+index)+'. '+item.options[index]:'Boş';
   const chosen=document.createElement('p');chosen.className=ok?'answer-correct':'answer-wrong';chosen.textContent='Senin cevabın: '+formatAnswer(item.selected_index);card.append(chosen);
   const right=document.createElement('p');right.className='answer-correct';right.textContent='Doğru cevap: '+formatAnswer(item.correct_index);card.append(right);
   if(item.outcome){const label=document.createElement('small');label.textContent='📘 Öğrenme çıktısı: '+item.outcome;card.append(label);const stat=outcomes.get(item.outcome)||{correct:0,total:0};stat.total++;if(ok)stat.correct++;outcomes.set(item.outcome,stat)}
   result.append(card);
  });
  if(outcomes.size){const section=document.createElement('h3');section.textContent='📚 Öğrenme Çıktısı Başarılarım';result.append(section);for(const [name,score] of outcomes){const line=document.createElement('p');line.className='outcome-result';line.textContent=name+' · '+score.correct+'/'+score.total+' doğru';result.append(line)}}
  else{const note=document.createElement('p');note.className='muted';note.textContent='Bu testin sorularına henüz öğrenme çıktısı etiketi eklenmemiştir.';result.append(note)}
 }
 result.classList.remove('hidden');result.scrollIntoView({behavior:'smooth'});say(r.correct===r.total?'Tebrikler '+studentName+'! Bütün soruları doğru yaptın.': 'Aferin '+studentName+'! '+r.correct+' doğru cevap verdin. Çalışmaya devam et.');$('quiz').classList.add('hidden');await Promise.all([leaderboard(),load()])}catch(e){const result=$('quizResult');result.textContent='⚠️ Test kaydedilemedi: '+e.message;result.classList.remove('hidden');result.scrollIntoView({behavior:'smooth'})}finally{b.disabled=false}};
function selectHubSection(){
 const section=new URLSearchParams(location.search).get('section')||'tests';
 const selected=['tests','games','league'].includes(section)?section:'tests';
 document.querySelectorAll('[data-hub-section]').forEach(el=>{if(el.id==='quiz'||el.id==='quizResult'){if(selected!=='tests')el.classList.add('hidden')}else el.classList.toggle('hidden',el.dataset.hubSection!==selected)});
 if(new URLSearchParams(location.search).get('embed')==='1'){document.querySelector('header')?.remove();document.querySelector('main > a')?.remove();document.querySelector('.voice-panel')?.classList.add('hidden');document.body.classList.add('embedded')}
}
async function init(){const {data:{session:s}}=await db.auth.getSession();if(!s){$('message').textContent='Derslikten öğrenci hesabınızla giriş yapın.';return}session=s;try{const {data:p}=await db.from('profiles').select('display_name').eq('id',s.user.id).maybeSingle();if(p?.display_name)studentName=p.display_name.trim().split(/\s+/)[0];await Promise.all([load(),loadGames(),leaderboard()]);selectHubSection();$('message').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('message').textContent='Merkez açılamadı: '+e.message}}init();
</script></body></html>
