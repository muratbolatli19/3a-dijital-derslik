<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3/A Bilgi Macerası</title><style>*{box-sizing:border-box}body{margin:0;font:18px system-ui;background:linear-gradient(130deg,#f1eaff,#dcf6ff,#fff3dc);color:#27345d}main{max-width:920px;margin:30px auto;padding:20px}.hero{background:linear-gradient(115deg,#5e45bd,#268eb9);color:white;padding:28px;border-radius:24px}.hero h1{font-size:clamp(27px,5vw,44px)}.card{padding:25px;background:#fff;border-radius:22px;margin:18px 0;box-shadow:0 8px 28px #38447b19}.choice{display:block;width:100%;padding:17px;text-align:left;margin:12px 0;border:2px solid #d5dff3;background:#f0f5ff;border-radius:15px;font:inherit;cursor:pointer;color:#27345d}.choice:hover{background:#e2eaff}.choice:disabled{opacity:.7;cursor:default}.choice.good{border-color:#279d73;background:#e0f8ee}.choice.bad{border-color:#cc633c;background:#ffece7}a{color:#4a41b2}button.primary{background:#5346b7;color:white;border:0;padding:15px 25px;border-radius:15px;font-weight:800;font-size:17px;cursor:pointer}button:disabled{opacity:.5}.progress{height:13px;background:#dde4f5;border-radius:20px;overflow:hidden}.bar{background:#37ad87;height:100%;transition:width .2s}.footnote{font-size:14px;color:#54637f}.hidden{display:none}#feedback{font-weight:800;padding:12px}</style></head><body><main><a href="oyun-test-merkezi.html?section=games">← Oyunlara dön</a><div class="hero"><h1 id="heading">🚀 Bilgi Macerası</h1><p>Her doğru cevap yeni bir yıldız! Soruları dikkatle oku.</p></div><div class="card"><div class="progress"><div id="bar" class="bar" style="width:0"></div></div><p id="counter"></p><h2 id="question"></h2><div id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary hidden">Sonraki soru →</button></div><p class="footnote">Bu oyunlar alıştırma içindir. Puanlar sınıfın Yıldız Ligi hesabına henüz aktarılmaz.</p></main><script>
const sets={
turkce:{name:'📚 Eş ve Zıt Anlam Dedektifi',questions:[['Mutlu kelimesinin eş anlamlısı hangisidir?',['Neşeli','Kızgın','Yorgun'],0],['Uzun kelimesinin zıt anlamlısı hangisidir?',['Geniş','Kısa','Yavaş'],1],['Cevap kelimesinin eş anlamlısı hangisidir?',['Soru','Yanıt','Öykü'],1],['Hızlı kelimesinin zıt anlamlısı hangisidir?',['Çabuk','Süratli','Yavaş'],2],['Konuk kelimesinin eş anlamlısı hangisidir?',['Misafir','Ev sahibi','Komşu'],0]]},
matematik:{name:'🧮 Çarpım Tablosu Şampiyonu',questions:[['7 × 8 kaçtır?',['54','56','64'],1],['6 × 9 kaçtır?',['54','56','63'],0],['8 × 4 kaçtır?',['24','36','32'],2],['9 × 7 kaçtır?',['63','72','56'],0],['5 × 8 kaçtır?',['45','35','40'],2]]},
fen:{name:'🔬 Canlılar ve Duyular',questions:[['Yarasalar yön bulurken neyden yararlanabilir?',['Yankıdan','Renklerden','Toprağın tadından'],0],['Köpeklerin hangi duyusu güçlüdür?',['Koku alma','Tat alma','Görme'],0],['Baykuşlar hangi ortamda iyi görebilir?',['Az ışıkta','Su altında','Tamamen ışıksız'],0],['Çevremizdeki sesleri hangi organımızla algılarız?',['Göz','Kulak','Dil'],1],['Bitkiler hangi kaynağı kullanarak fotosentez yapar?',['Güneş ışığı','Ay ışığı','Rüzgâr sesi'],0]]},
hayat:{name:'🌱 Sağlıklı Yaşam Kaşifi',questions:[['Ellerimizi ne zaman yıkamalıyız?',['Yemekten önce','Sadece akşam','Sadece yağmurda'],0],['Dengeli beslenme nasıl olur?',['Tek besinden çok yemek','Farklı besin gruplarından yeterince yemek','Yalnız tatlı yemek'],1],['Dişlerimizi düzenli temizlemek neyi korur?',['Ağız sağlığını','Ayakkabıları','Oyuncakları'],0],['Trafikte karşıya geçerken neresi tercih edilir?',['Yaya geçidi','Virajın ortası','Park etmiş araçların arası'],0],['Sağlıklı olmak için hangisi önemlidir?',['Yeterince uyumak','Gece hiç uyumamak','Her gün sadece şeker yemek'],0]]},
klasik:{name:'🎲 Karışık Bilgi Yarışması',questions:[['Türkiye’nin başkenti neresidir?',['Ankara','İstanbul','İzmir'],0],['4 × 6 kaçtır?',['20','24','28'],1],['Soğuk kelimesinin zıt anlamlısı nedir?',['Ilık','Sıcak','Serin'],1],['Bir hafta kaç gündür?',['5','6','7'],2],['Vücudumuzun görme organı hangisidir?',['Kulak','Göz','Burun'],1]]}
};
const key=new URLSearchParams(location.search).get('oyun')||'klasik';const game=sets[key]||sets.klasik;const $=id=>document.getElementById(id);$('heading').textContent=game.name;let index=0,score=0,answered=false;
function render(){answered=false;const item=game.questions[index];$('counter').textContent=(index+1)+' / '+game.questions.length+' · ⭐ '+score+' doğru';$('question').textContent=item[0];$('bar').style.width=(100*index/game.questions.length)+'%';$('choices').replaceChildren();$('feedback').textContent='';$('next').classList.add('hidden');item[1].forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+') '+answer;b.onclick=()=>choose(i);$('choices').append(b)})}
function choose(i){if(answered)return;answered=true;const q=game.questions[index],correct=i===q[2];if(correct)score++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('good');else if(j===i)b.classList.add('bad')});$('feedback').textContent=correct?'🌟 Harika! Doğru cevap.':'💡 Doğru cevap: '+q[1][q[2]];$('next').textContent=index===game.questions.length-1?'Sonuçlarımı gör':'Sonraki soru →';$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index<game.questions.length){render();return}$('bar').style.width='100%';$('counter').textContent='Tebrikler!';$('question').textContent='🏆 '+score+' / '+game.questions.length+' doğru';$('choices').replaceChildren();$('feedback').textContent='Bu oyunu tekrar oynayabilirsin.';$('next').textContent='🔁 Yeniden oyna';$('next').onclick=()=>location.reload()};render();
</script></body></html>
