name: Prepare transparent Digital Classroom logo
on:
  push:
    paths:
      - '.github/workflows/prepare-transparent-logo.yml'
permissions:
  contents: write
jobs:
  make-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove light background and enhance image clarity
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance
          from collections import deque
          im=Image.open('dijital-derslik-onayli-logo.png').convert('RGB')
          im=im.resize((im.width*3, im.height*3),Image.Resampling.LANCZOS)
          w,h=im.size
          px=im.load()
          mask=Image.new('L',(w,h),255)
          a=mask.load()
          seen=bytearray(w*h)
          q=deque()
          for x in range(w):
              q.append((x,0));q.append((x,h-1))
          for y in range(h):
              q.append((0,y));q.append((w-1,y))
          while q:
              x,y=q.popleft()
              i=y*w+x
              if seen[i]:continue
              seen[i]=1
              r,g,b=px[x,y]
              if min(r,g,b)<165 or (max(r,g,b)-min(r,g,b)>70):continue
              a[x,y]=0
              if x>0:q.append((x-1,y))
              if x+1<w:q.append((x+1,y))
              if y>0:q.append((x,y-1))
              if y+1<h:q.append((x,y+1))
          mask=mask.filter(ImageFilter.GaussianBlur(.75))
          im=ImageEnhance.Sharpness(im).enhance(1.35)
          im.putalpha(mask)
          im.save('dijital-derslik-logo-seffaf.png',optimize=True)
          PY
      - name: Commit transparent logo
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dijital-derslik-logo-seffaf.png
          git commit -m "Add transparent Digital Classroom logo" || exit 0
          git push
